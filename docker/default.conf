# Live flight data for the tracker that takes over at zero. The browser cannot
# call the ADS-B feeds itself (they send no CORS headers), so nginx relays a few
# fixed lookups. Every viewer shares one cached upstream request per flight
# every few seconds, which stays inside the feeds' free rate limits (adsb.fi
# allows 1 request/second) however many people are watching.
#
# Upstream hosts are resolved per request through the resolver that
# docker/25-flight-resolver.sh writes, so a DNS failure can only break the
# tracker - never stop nginx from starting and serving the countdown.
proxy_cache_path /var/cache/nginx/flight levels=1:2 keys_zone=flight:2m
                 max_size=20m inactive=12h use_temp_path=off;

# adsb.lol names the registration lookup differently.
map $ac_kind $ac_kind_lol {
    registration reg;
    default      $ac_kind;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The page and its deadline settings are rewritten every time the container
    # starts, so a browser must never serve them from its own cache. Without
    # this, nginx sends no Cache-Control at all and browsers apply heuristic
    # freshness - which is how an edited deadline can appear not to have changed.
    location = / {
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Settings shared by every relay below.
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 4;
    proxy_connect_timeout 3s;
    proxy_next_upstream_tries 2;
    proxy_read_timeout 8s;
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    proxy_set_header User-Agent "the-final-countdown flight tracker";
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 6s;

    # /api/aircraft/callsign/UAL1 or /api/aircraft/registration/N81110 -> live
    # ADS-B position. adsb.fi first; adsb.lol if it refuses or is down.
    location ~ "^/api/aircraft/(callsign|registration)/([A-Z0-9-]{2,10})$" {
        set $ac_kind $1;
        set $ac_id $2;
        proxy_pass https://opendata.adsb.fi/api/v2/$ac_kind/$ac_id;
        proxy_cache flight;
        proxy_cache_key fi/$ac_kind/$ac_id;
        proxy_cache_valid 200 3s;
        # Rate-limited? Hand out the copy from a few seconds ago - the page
        # dates positions by the feed's own timestamp, so a stale copy reads
        # as exactly as old as it is.
        proxy_cache_use_stale updating http_429;
        proxy_intercept_errors on;
        error_page 403 404 429 500 502 503 504 = @adsb_lol;
        add_header Cache-Control "no-store" always;
        add_header X-Feed "adsb.fi" always;
    }

    location @adsb_lol {
        proxy_pass https://api.adsb.lol/v2/$ac_kind_lol/$ac_id;
        proxy_cache flight;
        proxy_cache_key lol/$ac_kind/$ac_id;
        proxy_cache_valid 200 3s;
        proxy_cache_use_stale updating;
        add_header Cache-Control "no-store" always;
        add_header X-Feed "adsb.lol" always;
    }

    # /api/route/UAL1 -> scheduled origin and destination (adsbdb.com). Routes
    # rarely change, so this is cached for hours; "unknown callsign" (404) for
    # ten minutes, in case it gets added.
    location ~ "^/api/route/([A-Z0-9]{2,8})$" {
        set $route_cs $1;
        proxy_pass https://api.adsbdb.com/v0/callsign/$route_cs;
        proxy_cache flight;
        proxy_cache_key route/$route_cs;
        proxy_cache_valid 200 6h;
        proxy_cache_valid 400 404 10m;
        proxy_cache_use_stale updating error timeout http_429 http_500 http_502 http_503 http_504;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        return 404;
    }
}
