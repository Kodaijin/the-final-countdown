server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The page and its deadline settings are rewritten every time the container
    # starts, so a browser must never serve them from its own cache. Without
    # this, nginx sends no Cache-Control at all and browsers apply heuristic
    # freshness - which is how an edited deadline can appear not to have changed.
    location = / {
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
