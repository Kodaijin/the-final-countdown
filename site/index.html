<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Final Countdown</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%8F%B3</text></svg>">
<style>
  :root {
    --bg: #05060a;
    /* hue of the accent; JS slides it 186 (cyan) -> 320 (hot magenta) as time runs out */
    --accent-h: 186;
    --accent: hsl(var(--accent-h) 100% 62%);
    --glow: hsl(var(--accent-h) 100% 62% / 0.85);
    --line: hsl(var(--accent-h) 100% 62% / 0.55);
    --dim: #6b7a8c;
    --horizon-y: 58%;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Consolas, "Roboto Mono", monospace;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--accent);
    font-family: var(--mono);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
  }

  /* ---------- scene ---------- */

  .scene {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background: linear-gradient(
      to bottom,
      #05060a 0%,
      #080a1a 24%,
      #170a33 43%,
      #43124d 55%,
      #2a0b33 var(--horizon-y),
      #0a0612 calc(var(--horizon-y) + 6%),
      #06040c 100%
    );
  }

  .sky {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: var(--horizon-y);
    overflow: hidden;
  }

  .stars {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 100%;
    background-image:
      radial-gradient(1px 1px at 14px 22px, rgba(255,255,255,0.85) 50%, transparent 51%),
      radial-gradient(1px 1px at 71px 96px, rgba(255,255,255,0.55) 50%, transparent 51%),
      radial-gradient(1.6px 1.6px at 133px 47px, rgba(255,255,255,0.75) 50%, transparent 51%),
      radial-gradient(1px 1px at 39px 148px, rgba(255,255,255,0.45) 50%, transparent 51%);
    background-size: 130px 110px, 190px 150px, 260px 210px, 320px 260px;
    animation: twinkle 7s ease-in-out infinite;
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 55%, transparent 92%);
    mask-image: linear-gradient(to bottom, #000 0%, #000 55%, transparent 92%);
  }

  .sun-glow {
    position: absolute;
    left: 50%;
    top: 100%;
    width: clamp(420px, 78vmin, 1000px);
    aspect-ratio: 1;
    transform: translate(-50%, -62%);
    background: radial-gradient(
      circle,
      hsl(var(--accent-h) 100% 62% / 0.30) 0%,
      hsl(320 100% 60% / 0.20) 34%,
      transparent 68%
    );
    opacity: 0.35;
  }

  .sun {
    position: absolute;
    left: 50%;
    top: 100%;
    width: clamp(240px, 38vmin, 500px);
    aspect-ratio: 1;
    transform: translate(-50%, -78%);
    border-radius: 50%;
    background: linear-gradient(
      to bottom,
      #fff6cf 0%,
      #ffd85a 18%,
      #ff9d3d 42%,
      #ff3d7a 72%,
      #d21ea8 100%
    );
    /* classic banded sun: solid on top, gaps widening toward the bottom */
    --bands: linear-gradient(
      to bottom,
      #000 0 31%,
      transparent 31% 33%,
      #000 33% 40%,
      transparent 40% 43%,
      #000 43% 49.5%,
      transparent 49.5% 53.5%,
      #000 53.5% 59.5%,
      transparent 59.5% 64.5%,
      #000 64.5% 69.5%,
      transparent 69.5% 75.5%,
      #000 75.5% 79%,
      transparent 79% 100%
    );
    -webkit-mask-image: var(--bands);
    mask-image: var(--bands);
  }

  .horizon {
    position: absolute;
    left: -5%; right: -5%;
    top: var(--horizon-y);
    height: 2px;
    background: linear-gradient(
      90deg,
      transparent 0%,
      var(--accent) 16%,
      #ffffff 50%,
      var(--accent) 84%,
      transparent 100%
    );
    box-shadow: 0 0 22px var(--glow), 0 0 70px var(--glow);
    opacity: 0.85;
    will-change: transform, opacity;
  }

  .floor {
    position: absolute;
    left: 0; right: 0;
    top: var(--horizon-y);
    bottom: 0;
    overflow: hidden;
    perspective: 420px;
    perspective-origin: 50% 0%;
  }

  .grid {
    position: absolute;
    left: -75%; right: -75%;
    top: 0;
    height: 150vh;
    transform-origin: 50% 0;
    transform: rotateX(80deg);
    background-image:
      repeating-linear-gradient(to right, var(--line) 0 2px, transparent 2px 72px),
      repeating-linear-gradient(to bottom, var(--line) 0 2px, transparent 2px 72px);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 10%, #000 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, #000 10%, #000 100%);
    will-change: transform;
  }

  /* keeps the digits readable over the sun */
  .scrim {
    position: absolute;
    inset: 0;
    background: radial-gradient(
      ellipse 62% 34% at 50% 50%,
      rgba(5, 6, 10, 0.34) 0%,
      rgba(5, 6, 10, 0.16) 55%,
      transparent 78%
    );
  }

  /* scanline texture, on top of everything */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.025) 0px,
      rgba(255, 255, 255, 0.025) 1px,
      transparent 1px,
      transparent 3px
    );
  }

  /* ---------- clock ---------- */

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1400px;
    text-align: center;
  }

  .eyebrow {
    margin: 0 0 clamp(12px, 3vh, 32px);
    font-size: clamp(0.7rem, 1.8vw, 1.1rem);
    font-weight: 500;
    letter-spacing: 0.55em;
    text-indent: 0.55em;
    text-transform: uppercase;
    color: #ffb3ec;
    text-shadow: 0 0 12px rgba(255, 79, 216, 0.55);
  }

  .clock {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: center;
    gap: 0 clamp(6px, 1.4vw, 20px);
    font-variant-numeric: tabular-nums;
  }

  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .val {
    display: block;
    font-size: clamp(2.6rem, 8.5vw, 9rem);
    line-height: 1;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #f4feff;
    text-shadow:
      0 0 6px rgba(0, 0, 0, 0.85),
      0 0 14px var(--glow),
      0 0 40px var(--glow),
      0 0 90px hsl(var(--accent-h) 100% 62% / 0.35);
  }

  .lbl {
    margin-top: clamp(6px, 1.2vh, 16px);
    font-size: clamp(0.55rem, 1.3vw, 0.9rem);
    letter-spacing: 0.4em;
    text-indent: 0.4em;
    text-transform: uppercase;
    color: #bccbdb;
    text-shadow: 0 0 6px rgba(0, 0, 0, 0.95), 0 0 16px rgba(0, 0, 0, 0.85);
  }

  .sep {
    align-self: flex-start;
    font-size: clamp(2.6rem, 8.5vw, 9rem);
    line-height: 1;
    font-weight: 700;
    color: hsl(var(--accent-h) 100% 62% / 0.4);
  }

  /* centiseconds ride along with the seconds column */
  .cs {
    font-size: 0.42em;
    color: #ff7ae0;
    text-shadow:
      0 0 6px rgba(0, 0, 0, 0.85),
      0 0 12px rgba(255, 79, 216, 0.9),
      0 0 30px rgba(255, 79, 216, 0.5);
    vertical-align: baseline;
    margin-left: 0.06em;
  }

  .target {
    margin: clamp(24px, 6vh, 56px) 0 0;
    font-size: clamp(0.7rem, 1.6vw, 1rem);
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    text-transform: uppercase;
    color: #9fb0c2;
    text-shadow: 0 0 8px rgba(0, 0, 0, 0.95), 0 0 18px rgba(0, 0, 0, 0.85);
  }

  .done .val,
  .done .sep,
  .done .lbl { display: none; }

  .done::before {
    content: "TIME'S UP";
    font-size: clamp(2.6rem, 11vw, 9rem);
    line-height: 1;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #fff;
    text-shadow:
      0 0 10px rgba(0, 0, 0, 0.85),
      0 0 26px var(--glow),
      0 0 70px var(--glow);
  }

  /* No deadline configured: the digits would be meaningless, so say so instead. */
  .unset .val,
  .unset .sep,
  .unset .lbl { display: none; }

  .unset::before {
    content: "NO DEADLINE SET";
    font-size: clamp(1.7rem, 7vw, 5rem);
    line-height: 1;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #fff;
    text-shadow:
      0 0 10px rgba(0, 0, 0, 0.85),
      0 0 26px var(--glow),
      0 0 70px var(--glow);
  }

  .target.error {
    color: #ffd9f2;
    letter-spacing: 0.12em;
    text-indent: 0.12em;
    text-transform: none;
    font-size: clamp(0.75rem, 1.5vw, 0.95rem);
    line-height: 1.7;
    max-width: 62ch;
    margin-left: auto;
    margin-right: auto;
  }

  .target.error code {
    font-family: inherit;
    color: #fff;
    background: rgba(255, 79, 216, 0.14);
    border: 1px solid rgba(255, 79, 216, 0.35);
    border-radius: 4px;
    padding: 0.1em 0.4em;
    white-space: nowrap;
  }

  /* ---------- flight tracker (takes over after zero) ---------- */

  .target-flight {
    margin: 12px 0 0;
    font-size: clamp(0.6rem, 1.2vw, 0.8rem);
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    text-transform: uppercase;
    color: #7f8fa3;
    text-shadow: 0 0 8px rgba(0, 0, 0, 0.95);
  }

  body.tracking {
    overflow-y: auto;
    align-items: flex-start;
  }

  .tracking .clock,
  .tracking .target,
  .tracking .target-flight { display: none; }

  .flight {
    text-align: left;
    background: rgba(8, 7, 20, 0.74);
    border: 1px solid hsl(var(--accent-h) 100% 62% / 0.35);
    border-radius: 10px;
    box-shadow:
      0 0 40px hsl(var(--accent-h) 100% 62% / 0.14),
      inset 0 0 60px rgba(0, 0, 0, 0.4);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    padding: clamp(14px, 2.4vw, 28px);
    animation: rise 0.9s ease-out both;
  }

  .flight[hidden],
  .fl-progress[hidden],
  .fl-note[hidden] { display: none; }

  .fl-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px 28px;
  }

  .fl-id {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 16px;
  }

  .fl-cs {
    font-size: clamp(1.8rem, 5vw, 3.4rem);
    line-height: 1;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #f4feff;
    text-shadow: 0 0 14px var(--glow), 0 0 40px var(--glow);
  }

  .fl-status {
    font-size: clamp(0.62rem, 1.3vw, 0.85rem);
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    text-transform: uppercase;
    padding: 0.4em 0.75em;
    border: 1px solid currentColor;
    border-radius: 4px;
    color: var(--accent);
    box-shadow: 0 0 14px hsl(var(--accent-h) 100% 62% / 0.25);
  }
  .fl-status.is-warn  { color: #ffd166; box-shadow: none; }
  .fl-status.is-alert { color: #ff4d6d; box-shadow: 0 0 18px rgba(255, 77, 109, 0.45); }
  .fl-status.is-done  { color: #7dffb2; box-shadow: 0 0 14px rgba(125, 255, 178, 0.3); }

  .fl-route {
    color: #bccbdb;
    font-size: clamp(0.78rem, 1.5vw, 1rem);
    letter-spacing: 0.06em;
  }
  .fl-route b {
    color: #fff;
    font-size: 1.3em;
    letter-spacing: 0.12em;
  }
  .fl-route .arrow { color: var(--accent); margin: 0 0.6em; }
  .fl-route.doubt { opacity: 0.4; text-decoration: line-through; }

  /* a route on file that the plane is clearly not flying */
  .route-doubt .fl-route-line,
  .route-doubt .fl-ap,
  .route-doubt .leaflet-tooltip.fl-ap-tip { opacity: 0.25; }

  /* itinerary strip, for a trip of more than one flight */
  .fl-legs {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
  }
  .fl-legs[hidden] { display: none; }

  .fl-leg {
    display: inline-flex;
    align-items: center;
    gap: 0.6em;
    padding: 0.35em 0.9em 0.35em 0.35em;
    font: inherit;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    color: #bccbdb;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    cursor: pointer;
  }
  .fl-leg:hover { border-color: rgba(255, 255, 255, 0.3); }
  .fl-leg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .fl-leg small { font-size: 0.95em; letter-spacing: 0.08em; color: #7f8fa3; }

  .fl-leg-n {
    display: inline-grid;
    place-items: center;
    width: 1.9em;
    height: 1.9em;
    border: 1px solid currentColor;
    border-radius: 50%;
    font-weight: 700;
  }
  .fl-leg.is-now .fl-leg-n { color: var(--accent); }
  .fl-leg.is-done .fl-leg-n { color: #7dffb2; background: rgba(125, 255, 178, 0.1); }
  .fl-leg.is-viewed {
    color: #fff;
    border-color: hsl(var(--accent-h) 100% 62% / 0.6);
    background: hsl(var(--accent-h) 100% 62% / 0.12);
    box-shadow: 0 0 14px hsl(var(--accent-h) 100% 62% / 0.25);
  }

  .fl-leg-sep {
    width: 18px;
    height: 1px;
    background: rgba(255, 255, 255, 0.2);
  }

  .fl-progress {
    position: relative;
    height: 4px;
    margin: 18px 0 4px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 2px;
  }
  .fl-progress i {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0;
    border-radius: 2px;
    background: linear-gradient(90deg, hsl(186 100% 62%), var(--accent));
    box-shadow: 0 0 12px var(--glow);
    transition: width 1s linear;
  }

  .fl-note {
    margin: 16px 0 0;
    font-size: clamp(0.75rem, 1.4vw, 0.9rem);
    line-height: 1.7;
    color: #bccbdb;
    max-width: 75ch;
  }

  .wrap.has-flight { min-width: 0; }

  .fl-body {
    display: grid;
    grid-template-columns: minmax(0, 1.7fr) minmax(250px, 1fr);
    gap: clamp(12px, 2vw, 22px);
    margin-top: 18px;
  }

  .fl-map {
    position: relative;
    height: min(58vh, 560px);
    min-height: 300px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.08);
    background: #07070f;
  }

  .map-msg {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 16px;
    text-align: center;
    font-size: 0.72rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #6b7a8c;
  }

  .fl-stats {
    margin: 0;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    align-content: start;
  }

  .fl-stat {
    min-width: 0;
    padding: 12px 14px;
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 6px;
  }
  .fl-stat.wide { grid-column: 1 / -1; }

  .fl-stat dt {
    margin-bottom: 6px;
    font-size: 0.62rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #7f8fa3;
  }

  .fl-stat dd {
    margin: 0;
    font-size: clamp(1.05rem, 1.8vw, 1.4rem);
    font-weight: 700;
    color: #f4feff;
    font-variant-numeric: tabular-nums;
  }

  .fl-stat dd > span,
  .fl-stat small {
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .fl-stat small {
    margin-top: 4px;
    font-size: 0.72rem;
    font-weight: 400;
    color: #9fb0c2;
  }

  .fl-foot {
    margin: 14px 0 0;
    font-size: 0.68rem;
    line-height: 1.7;
    letter-spacing: 0.05em;
    color: #6b7a8c;
  }
  .fl-foot a { color: #9fb0c2; }

  .fl-note code {
    font-family: inherit;
    color: #fff;
    background: rgba(255, 79, 216, 0.14);
    border: 1px solid rgba(255, 79, 216, 0.35);
    border-radius: 4px;
    padding: 0.1em 0.4em;
  }

  /* Leaflet, themed to the scene */
  .fl-map .leaflet-container {
    width: 100%;
    height: 100%;
    background: #07070f;
    font-family: var(--mono);
  }
  /* light OSM tiles -> a dark, violet-tinted night map */
  .fl-map .leaflet-tile-pane {
    filter: invert(1) hue-rotate(200deg) saturate(0.5) brightness(0.8) contrast(1.15);
  }
  .fl-map .leaflet-control-attribution {
    background: rgba(5, 6, 10, 0.75);
    color: #6b7a8c;
    font-size: 0.6rem;
  }
  .fl-map .leaflet-control-attribution a { color: #9fb0c2; }
  .fl-map .leaflet-bar { border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: none; }
  .fl-map .leaflet-bar a {
    background: rgba(13, 12, 29, 0.9);
    color: var(--accent);
    border-bottom-color: rgba(255, 255, 255, 0.12);
    font-family: var(--mono);
  }
  .fl-map .leaflet-bar a:hover { background: #1a1834; }

  .fl-route-line {
    stroke: hsl(var(--accent-h) 100% 62% / 0.25);
    stroke-dasharray: 4 8;
  }
  .fl-route-line.is-viewed { stroke: hsl(var(--accent-h) 100% 62% / 0.6); }
  .fl-route-line.is-done { stroke: rgba(125, 255, 178, 0.3); stroke-dasharray: none; }
  .fl-trail-line {
    stroke: var(--accent);
    filter: drop-shadow(0 0 4px var(--glow));
  }
  .fl-trail-line.is-dim { stroke: rgba(125, 255, 178, 0.55); filter: none; }
  .fl-ap { stroke: #fff; fill: var(--accent); }

  .fl-map .leaflet-tooltip.fl-ap-tip {
    background: rgba(5, 6, 10, 0.85);
    border: 1px solid hsl(var(--accent-h) 100% 62% / 0.5);
    border-radius: 3px;
    box-shadow: none;
    color: #fff;
    font-family: var(--mono);
    font-weight: 700;
    letter-spacing: 0.14em;
    padding: 2px 6px;
  }
  .fl-map .leaflet-tooltip.fl-ap-tip::before { display: none; }

  .fl-plane {
    width: 30px;
    height: 30px;
    color: #fff;
    filter: drop-shadow(0 0 3px #000) drop-shadow(0 0 8px var(--glow));
  }
  .fl-plane svg { display: block; width: 100%; height: 100%; }
  .fl-plane.stale { color: #8a94a6; filter: drop-shadow(0 0 3px #000); }

  /* second act: counting down to the landing */
  .fl-arrive {
    margin-top: 18px;
    text-align: center;
  }
  .fl-arrive[hidden] { display: none; }

  .fl-arrive-lbl {
    font-size: clamp(0.62rem, 1.3vw, 0.85rem);
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    text-transform: uppercase;
    color: #9fb0c2;
  }

  .fl-arrive-clock {
    margin-top: 8px;
    font-size: clamp(2.2rem, 7vw, 5.2rem);
    line-height: 1;
    font-weight: 700;
    color: #f4feff;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 6px rgba(0, 0, 0, 0.85), 0 0 14px var(--glow), 0 0 40px var(--glow);
  }
  .fl-arrive-clock i {
    font-style: normal;
    font-size: 0.36em;
    letter-spacing: 0.1em;
    margin: 0 0.6em 0 0.1em;
    color: #9fb0c2;
    text-shadow: none;
  }
  .fl-arrive-clock i:last-child { margin-right: 0; }

  /* altitude over the leg so far */
  .fl-alt {
    position: relative;
    margin-top: clamp(12px, 2vw, 22px);
    padding: 12px 14px;
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 6px;
  }

  .fl-alt-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .fl-alt-head span {
    font-size: 0.62rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #7f8fa3;
  }
  .fl-alt-head b {
    font-size: 0.8rem;
    color: #f4feff;
    font-variant-numeric: tabular-nums;
  }

  .fl-alt svg {
    display: block;
    width: 100%;
    height: 130px;
    margin-top: 8px;
    overflow: visible;
    touch-action: pan-y;
  }

  .fl-alt .xh { stroke: rgba(255, 255, 255, 0.35); stroke-width: 1; }
  .fl-alt .dot { fill: var(--accent); stroke: #0b0a18; stroke-width: 2; }

  .fl-alt-tip {
    position: absolute;
    z-index: 1;
    pointer-events: none;
    padding: 4px 8px;
    font-size: 0.72rem;
    color: #f4feff;
    white-space: nowrap;

    margin: 10px 0 2px;
    font-size: 0.72rem;
    color: #6b7a8c;
  }
  .fl-alt-empty[hidden] { display: none; }

  /* ---------- the last ten seconds, and zero ---------- */

  .final {

  .is-final .final { display: block; }

  .eyebrow, .clock, .final { -webkit-user-select: none; user-select: none; }

  .flash {
    position: fixed;
    inset: 0;
    z-index: 6;
    pointer-events: none;
    background: #fff;
    opacity: 0;

  .fx {
    position: fixed;
    inset: 0;
    z-index: 3;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .shoot {
    position: absolute;
    width: 150px;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, hsl(var(--accent-h) 100% 72% / 0.6) 70%, #fff);
    filter: drop-shadow(0 0 6px var(--glow));
    transform-origin: 0 50%;
    pointer-events: none;

  .scene[hidden] { display: none; }

  .scene canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .bg-hyperspace {
    background: radial-gradient(ellipse at 50% 50%, #0d0924 0%, #05040e 55%, #020207 100%);
  }

  .bg-globe {
    background: radial-gradient(ellipse at 50% 45%, #0b0b24 0%, #05060f 55%, #020208 100%);
  }
  .bg-globe .stars { opacity: 0.6; }
  html[data-bg="globe"] body:not(.tracking) { touch-action: none; }

  .bg-aurora {
    background: linear-gradient(to bottom, #01030a 0%, #030817 40%, #06162a 74%, #0a1d2c 100%);
  }
  .bg-aurora canvas { mix-blend-mode: screen; }
  .bg-aurora .ridge {
    position: absolute;
    left: -4%;
    bottom: 0;
    width: 108%;
    display: block;
  }
  .bg-aurora .ridge.far { height: 36vh; }
  .bg-aurora .ridge.near { height: 26vh; }

  /* departure board: split-flap tiles, dimmed so the clock reads over them */
  .bg-board {
    display: grid;
    place-items: center;
    perspective: 1400px;
    background: radial-gradient(ellipse at 50% 40%, #13131b 0%, #08080c 70%, #050507 100%);
  }
  .bg-board .scrim {
    background: radial-gradient(
      ellipse 66% 40% at 50% 50%,
      rgba(5, 6, 10, 0.78) 0%,
      rgba(5, 6, 10, 0.45) 60%,
      transparent 88%

  .board {
    font-family: var(--mono);
    font-weight: 700;
    color: #f1ede2;
    opacity: 0.45;
    transform-style: preserve-3d;

  .bhead {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.7em;
  }
  .btitle {
    font-size: 1.15em;
    letter-spacing: 0.35em;
    color: #ffd166;
  }

    margin-bottom: 0.35em;
    font-size: 0.62em;
    letter-spacing: 0.2em;
    color: #8f96a3;
  }

    position: relative;
    display: flex;
    gap: 0.6em;
    margin-bottom: 0.28em;

  .bfld { display: flex; gap: 0.08em; }

    display: inline-block;
    width: 0.82em;
    height: 1.22em;
    line-height: 1.22em;

  /* the clock's own digits become flap tiles to match */
  html[data-bg="board"] .val {
    padding: 0.04em 0.1em;
    border-radius: 0.07em;
    background: linear-gradient(#1c1c22 0 49.4%, #000 49.4% 50.6%, #16161b 50.6%);
    box-shadow: 0 0.04em 0.12em rgba(0, 0, 0, 0.6);
    text-shadow: 0 0 10px var(--glow);

  html[data-bg="board"] .cs { text-shadow: none; }

  /* ---------- corner controls ---------- */

  .controls {
    position: fixed;
    right: 14px;
    bottom: 14px;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px;
    border-radius: 10px;
    background: rgba(8, 7, 20, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.08);

    backdrop-filter: blur(6px);

  .controls.idle:not(:hover):not(:focus-within) { opacity: 0.14; }

  .ctl {
    display: inline-grid;
    place-items: center;
    width: 34px;
    height: 34px;
    padding: 0;
    color: #bccbdb;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 7px;

  .ctl[aria-pressed="true"] {
    color: var(--accent);

  }
  .ctl svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .ctl-bg select {
    height: 34px;
    padding: 0 8px;
    font: inherit;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    color: #bccbdb;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 7px;
    cursor: pointer;

  .ctl-bg select option { background: #0d0c1d; color: #f4feff; }
  .ctl:focus-visible,
  .ctl-bg select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .vh {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: none; }
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }

    .stars { animation: none; opacity: 0.8; }
    .flight { animation: none; }

  }

  /* tracker on narrow screens: map on top, stats below, page scrolls */
  @media (max-width: 860px) {
    .fl-body { grid-template-columns: minmax(0, 1fr); }
    .fl-map { height: 46vh; min-height: 260px; }
  }

  @media (max-width: 700px) {
    body.tracking { padding: 16px 16px 72px; }
    .controls { right: 10px; bottom: 10px; }
  }

  @media (max-width: 700px) {
    :root { --horizon-y: 62%; }
    .clock { gap: clamp(4px, 2vw, 14px) clamp(4px, 2vw, 14px); }
    .val, .sep { font-size: clamp(2.8rem, 17vw, 5rem); }
    .sep.mid { display: none; }
    .brk { flex-basis: 100%; height: 0; }
    .floor { perspective: 300px; }
    .sun { width: clamp(190px, 54vmin, 300px); }
  }
  .brk { display: none; }
  @media (max-width: 700px) { .brk { display: block; } }

<body>
  <div class="scene" id="sceneSynth" aria-hidden="true">
