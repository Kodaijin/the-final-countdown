    if (!m) return NaN;
    var naive = Date.UTC(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
    var guess = naive - offsetAt(naive, tz);
    return naive - offsetAt(guess, tz); // second pass settles DST edges
  }

  function validZone(tz) {
    try { new Intl.DateTimeFormat('en-US', { timeZone: tz }); return true; }
    catch (e) { return false; }
  }

  // Anything wrong with the deadline replaces the digits with an explanation.
  // The background, picker and sound keep running, so the page reads as unset
  // rather than broken.
  var TARGET = NaN;
  if (!wanted) {
    unconfigured(
      'No deadline set. Put <code>COUNTDOWN_TARGET</code> in <code>.env</code> ' +
      '(start from <code>.env.example</code>), then run ' +
      '<code>docker compose up -d --build</code>.'
    );
  } else if (zone && !validZone(zone)) {
    unconfigured(
      'COUNTDOWN_TZ is not a timezone: <code>' + esc(zone) + '</code>. ' +
      'Use an IANA name such as <code>America/Los_Angeles</code>, or leave it blank.'
    );
  } else {
    var hasOffset = /(?:Z|[+-]\d{2}:?\d{2})$/i.test(String(wanted).trim());
    // With an explicit offset the string is already absolute; with a zone it is
    // wall-clock time there; with neither it is the viewer's own local time.
    TARGET = (!hasOffset && zone)
      ? parseInZone(String(wanted), zone)
      : Date.parse(wanted);

    if (isNaN(TARGET)) {
      unconfigured(
        'Could not read the deadline <code>' + esc(wanted) + '</code>. Expected ' +
        '<code>YYYY-MM-DDTHH:MM</code>' + (zone ? ' in ' + esc(zone) : '') +
        ', or an absolute instant like <code>2026-10-30T01:00:00Z</code>.'
      );
    }
  }
  var ok = !isNaN(TARGET);
  var customLabel = label;

  if (ok && !label) {
    // Spelled out component by component: dateStyle/timeStyle cannot be combined
    // with timeZoneName, and the zone abbreviation is the point of the caption.
    var fmt = {
      year: 'numeric', month: 'short', day: 'numeric',
      hour: 'numeric', minute: '2-digit'
    };
    if (zone) { fmt.timeZone = zone; fmt.timeZoneName = 'short'; }
    try { label = new Date(TARGET).toLocaleString(undefined, fmt); }
    catch (e) { label = new Date(TARGET).toLocaleString(); }
  }
  if (ok) targetEl.textContent = label;

  var tracker = window.FlightTracker;
  var flights = flight && tracker ? tracker.legsOf(flight) : null;
  var flightShown = flights && flights.join(' → ');
  if (ok && flightShown) {
    var hint = document.getElementById('targetFlight');
    hint.textContent = 'Then live tracking: ' + flightShown +
      (flightRoute ? ' · ' + flightRoute.toUpperCase() : '');
    hint.hidden = false;
  }

  var root = document.documentElement;
  var wrap = document.querySelector('.wrap');
  var finalEl = document.getElementById('final');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var Scenes = window.Scenes, FX = window.FX, Sound = window.Sound;
  var tracking = false;

  // At zero the clock gives way to the tracker - after a few seconds of TIME'S UP
  // if the viewer watched it hit zero, straight away if they arrived later.
  function startTracking() {
    if (!flightShown || !tracker.start(flight, { tz: zone, route: flightRoute })) return;
    tracking = true;
    document.body.classList.add('tracking');
    document.querySelector('.eyebrow').textContent = "Time's up · live";
  }

  // Flash, fireworks, the scene's own moment and the fanfare. Only for a zero
  // the viewer actually watched - not for a page opened after it.
  function celebrate() {
    FX.celebrate('zero');
    if (scene.zero && !reduce) scene.zero();
    Sound.drone(0);
    Sound.fanfare();
  }

  if (flightShown) {
    tracker.on(function (e) {
      if (e.type === 'landed' && e.last) {
        FX.celebrate('landed');
        Sound.chime();
      }
      flightAlert(e);
    });
  }

  // ---- settings each viewer keeps for themselves ----

  function stored(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function store(k, v) {
    try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {}
  }

  var ICON = {
    soundOn: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/>' +
             '<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
    soundOff: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/>' +
              '<path d="M17 9.5l5 5M22 9.5l-5 5"/></svg>',
    fsOn: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
    fsOff: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>'
  };

  // Background. COUNTDOWN_BG sets the default; ?bg= on the URL, then the
  // viewer's own pick from the corner menu, win over it. An unknown name falls
  // back to the default rather than blanking the page.
  var bgPick = document.getElementById('bgPick');
  var bgDefault = Scenes.valid(cfg.bg) || 'synthwave';
  var bgUrl = Scenes.valid(qs.get('bg'));
  var sceneInfo = { target: TARGET, zone: zone, label: customLabel, flights: flights, route: flightRoute };
  var scene = null;

  function useScene(name) {
    // synthwave is in the page from the start; any other scene replaces it
    if (scene) scene.stop();
    else document.getElementById('sceneSynth').hidden = name !== 'synthwave';
    root.setAttribute('data-bg', name);
    scene = Scenes.make(name, sceneInfo);
    bgPick.value = name;
  }

  Scenes.list.forEach(function (s) {
    var o = document.createElement('option');
    o.value = s[0];
    o.textContent = s[1] + (s[0] === bgDefault ? ' (default)' : '');
    bgPick.appendChild(o);
  });
  bgPick.addEventListener('change', function () {
    var name = bgPick.value;
    store('fc-bg', name === bgDefault ? null : name);
    if (bgUrl) {
      // keep a ?bg= link in step with what is on screen
      var u = new URL(location.href);
      u.searchParams.set('bg', name);
      history.replaceState(null, '', u);
    }
    useScene(name);
  });
  useScene(bgUrl || Scenes.valid(stored('fc-bg')) || bgDefault);
  window.addEventListener('resize', function () { if (scene.resize) scene.resize(); });

  // Sound: off unless this viewer turned it on before.
  var sndBtn = document.getElementById('sndBtn');
  function showSound() {
    var on = Sound.enabled();
    sndBtn.innerHTML = on ? ICON.soundOn : ICON.soundOff;
    sndBtn.setAttribute('aria-pressed', on);
    sndBtn.title = on ? 'Sound on' : 'Sound off';
  }
  if (Sound.supported) {
    Sound.set(stored('fc-sound') === '1', true);
    showSound();
    sndBtn.addEventListener('click', function () {
      Sound.set(!Sound.enabled());
      store('fc-sound', Sound.enabled() ? '1' : null);
      showSound();
    });
  } else {
    sndBtn.hidden = true;
  }

  // Flight alerts: browser notifications for takeoff, landing and emergencies,
  // which arrive even with the tab in the background. Browsers only offer them
  // over https (or on localhost).
  var bellBtn = document.getElementById('bellBtn');
  var canAlert = !!flightShown && 'Notification' in window && window.isSecureContext;
  function alertsOn() {
    return canAlert && Notification.permission === 'granted' && stored('fc-alerts') === '1';
  }
  function showBell() {
    bellBtn.setAttribute('aria-pressed', alertsOn());
    bellBtn.title = alertsOn() ? 'Flight alerts on'
      : Notification.permission === 'denied' ? 'Flight alerts are blocked in this browser\'s settings'
      : 'Flight alerts: takeoff and landing';
  }
  if (canAlert) {
    bellBtn.hidden = false;
    showBell();
    bellBtn.addEventListener('click', function () {
      if (alertsOn()) { store('fc-alerts', null); showBell(); return; }
      Promise.resolve(Notification.requestPermission()).then(function (p) {
        if (p === 'granted') store('fc-alerts', '1');
        showBell();
      });
    });
  }

  function notify(title, body, tag) {
    if (!alertsOn()) return;
    try { new Notification(title, { body: body || '', tag: tag }); } catch (e) {}
  }

  function flightAlert(e) {
    var r = e.route;
    if (e.type === 'takeoff') {
      notify(e.flight + ' has taken off',
             (r ? r.from.code + ' → ' + r.to.code : '') + (e.eta ? (r ? ' · ' : '') + 'lands about ' + e.eta : ''),
             'fc-' + e.leg + '-up');
    } else if (e.type === 'landed') {
      notify(e.flight + ' has landed' + (r ? ' in ' + r.to.city : ''),
             e.next ? 'Next up: ' + e.next : 'That was the last flight.', 'fc-' + e.leg + '-down');
    } else {
      notify(e.flight + ': ' + e.status, 'The aircraft is squawking an emergency code.', 'fc-' + e.leg + '-sos');
    }
  }

  // Keep the screen on, for a page left up on a TV or a spare laptop. The
  // browser drops the lock whenever the tab is hidden; it is taken again on return.
  var wakeBtn = document.getElementById('wakeBtn');
  var wakeWanted = stored('fc-wake') === '1', wakeLock = null;
  function wake() {
    if (!wakeWanted || wakeLock || document.hidden) return;
    navigator.wakeLock.request('screen').then(function (l) {
      wakeLock = l;
      l.addEventListener('release', function () { wakeLock = null; });
    }).catch(function () {});
  }
  if ('wakeLock' in navigator) {
    wakeBtn.hidden = false;
    wakeBtn.setAttribute('aria-pressed', wakeWanted);
    wakeBtn.addEventListener('click', function () {
      wakeWanted = !wakeWanted;
      store('fc-wake', wakeWanted ? '1' : null);
      wakeBtn.setAttribute('aria-pressed', wakeWanted);
      if (wakeWanted) wake();
      else if (wakeLock) wakeLock.release();
    });
    document.addEventListener('visibilitychange', wake);
    wake();
  }

  var fsBtn = document.getElementById('fsBtn');
  var fsReq = root.requestFullscreen || root.webkitRequestFullscreen;
  function fsOn() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function showFs() {
    fsBtn.innerHTML = fsOn() ? ICON.fsOff : ICON.fsOn;
    fsBtn.setAttribute('aria-pressed', fsOn());
    fsBtn.title = fsOn() ? 'Leave full screen' : 'Full screen';
  }
  if (fsReq) {
    fsBtn.hidden = false;
    showFs();
    fsBtn.addEventListener('click', function () {
      var p = fsOn() ? (document.exitFullscreen || document.webkitExitFullscreen).call(document)
                     : fsReq.call(root);
      if (p && p.catch) p.catch(function () {});
    });
    document.addEventListener('fullscreenchange', showFs);
    document.addEventListener('webkitfullscreenchange', showFs);
  }

  // The corner controls fade out after a few idle seconds and come back on
  // any movement, tap or key.
  var controls = document.getElementById('controls'), idleTimer = 0;
  function awake() {
    controls.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { controls.classList.add('idle'); }, 3000);
  }
  awake();

  // ---- pointer: parallax, taps and drags ----

  var aim = { x: 0, y: 0 }, par = { x: 0, y: 0 }, down = null, tiltAsked = false;

  // Taps on the background - anywhere but a control or the tracker panel - go
  // to the scene. The first one also lets sound start and, on iPhone, asks for
  // the tilt sensor that drives the parallax there.
  function onBackground(t) {
    return !(t.closest && t.closest('button, a, select, label, input, .flight, .controls'));
  }

  function askTilt() {
    if (tiltAsked || reduce) return;
    tiltAsked = true;
    var D = window.DeviceOrientationEvent;
    if (D && typeof D.requestPermission === 'function') D.requestPermission().catch(function () {});
  }

  window.addEventListener('pointerdown', function (e) {
    awake();
    Sound.unlock();
    if (e.button > 0 || !onBackground(e.target)) return;
    askTilt();
    down = { id: e.pointerId, x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, drag: false };
  });

  window.addEventListener('pointermove', function (e) {
    awake();
    if (e.pointerType === 'mouse') {
      aim.x = e.clientX / innerWidth * 2 - 1;
      aim.y = e.clientY / innerHeight * 2 - 1;
    }
    if (!down || e.pointerId !== down.id) return;
    if (!down.drag && Math.abs(e.clientX - down.x) + Math.abs(e.clientY - down.y) > 8) down.drag = true;
    if (down.drag && scene.drag) scene.drag(e.clientX - down.lx, e.clientY - down.ly, false);
    down.lx = e.clientX;
    down.ly = e.clientY;
  });

  window.addEventListener('pointerup', function (e) {
    if (!down || e.pointerId !== down.id) return;
    if (down.drag) { if (scene.drag) scene.drag(0, 0, true); }
    else if (scene.poke) scene.poke(e.clientX, e.clientY);
    down = null;
  });
  window.addEventListener('pointercancel', function () { down = null; });
  window.addEventListener('keydown', function () { awake(); Sound.unlock(); });

  window.addEventListener('deviceorientation', function (e) {
    if (e.gamma === null || e.beta === null) return;
    aim.x = Math.max(-1, Math.min(1, e.gamma / 30));
    aim.y = Math.max(-1, Math.min(1, (e.beta - 45) / 30));
  });

  // ---- the clock ----

  var el = {
    d: document.getElementById('d'),
    h: document.getElementById('h'),
    m: document.getElementById('m'),
    s: document.getElementById('s'),
    cs: document.getElementById('cs')
  };
  var last = { d: null, h: null, m: null, s: null, cs: null };

  var arrEl = document.getElementById('flArrive');
  var arrLbl = document.getElementById('flArriveLbl');
  var arrClock = document.getElementById('flArriveClock');
  var arrLabel = '', arrText = '';

  var HUE_CALM = 186; // cyan
  var HUE_HOT = 320;  // hot magenta

  var hueNow = HUE_CALM;
  var lastT = 0;
  var lastHue = -1;
  var done = false;
  var firstFrame = true;
  var isFinal = false;
  var lastN = 0;
  var S = {};
  var sceneErr = false;

  // Grid speed in px/s, interpolated on log10(seconds remaining) so it ramps
  // continuously instead of stepping: calm a week out, hyperspace at the end.
  var SPEED = [[6, 18], [5, 26], [4, 42], [3, 70], [2, 140], [1, 340], [0, 900]];

  function speedFor(ms) {
    var L = Math.log10(Math.max(ms, 1) / 1000);
    if (L >= SPEED[0][0]) return SPEED[0][1];
    if (L <= 0) return SPEED[SPEED.length - 1][1];
    for (var i = 0; i < SPEED.length - 1; i++) {
      var a = SPEED[i], b = SPEED[i + 1];
      if (L <= a[0] && L >= b[0]) {
        return a[1] + (b[1] - a[1]) * ((a[0] - L) / (a[0] - b[0]));
      }
    }
    return SPEED[0][1];
  }

  // 0 while more than a day remains, 1 at zero - also on a log scale, so the
  // palette keeps visibly moving through the last hour, minute and seconds.
  function urgencyFor(ms) {
    var span = Math.log10(86400);
    var L = Math.log10(Math.max(ms, 1) / 1000);
    if (L >= span) return 0;
    if (L <= 0) return 1;
    return (span - L) / span;
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function set(key, text) {
    if (last[key] === text) return false;
    last[key] = text;
    el[key].textContent = text;
    return true;
  }

  // A digit that changes rolls in - or flaps over, on the departure board.
  function flip(node) {
    if (reduce || firstFrame || !node.animate) return;
    var board = root.getAttribute('data-bg') === 'board';
    node.animate(board
      ? [{ transform: 'perspective(400px) rotateX(-80deg)', filter: 'brightness(0.5)' },
         { transform: 'none', filter: 'none' }]
      : [{ transform: 'translateY(-0.16em)', opacity: 0.2, filter: 'blur(3px)' },
         { transform: 'none', opacity: 1, filter: 'none' }],
      { duration: board ? 240 : 320, easing: 'cubic-bezier(.2,.8,.3,1)' });
  }

  // Each of the last ten seconds lands with a punch.
  function pop(node) {
    if (reduce || !node.animate) return;
    node.animate([
      { transform: 'scale(1.45)', opacity: 0.3 },
      { transform: 'scale(1)', opacity: 1, offset: 0.3 },
      { transform: 'scale(0.94)', opacity: 0.85 }
    ], { duration: 1000, easing: 'ease-out' });
  }

  // The second act: big digits counting down to the landing, while in the air.
  function showArrival(arr, left) {
    if (!arr) { if (!arrEl.hidden) arrEl.hidden = true; return; }
    arrEl.hidden = false;
    var lbl = left > 0
      ? (arr.legs > 1 ? 'Flight ' + (arr.leg + 1) + ' of ' + arr.legs + ' · lands in ' : 'Lands in ') + arr.city + ' in'
      : 'Landing in ' + arr.city + ' any moment';
    var s = Math.floor(left / 1000), h = (s / 3600) | 0;
    var txt = (h ? h + '<i>h</i>' : '') + pad(((s / 60) | 0) % 60) + '<i>m</i>' + pad(s % 60) + '<i>s</i>';
    if (lbl !== arrLabel) { arrLabel = lbl; arrLbl.textContent = lbl; }
    if (txt !== arrText) { arrText = txt; arrClock.innerHTML = txt; }
  }

  function frame(now) {
    if (now === undefined) now = performance.now();
    // (the first rAF timestamp can be a hair before the performance.now() of
    // the direct first call, so never let time run backwards)
    var dt = lastT ? Math.max(0, Math.min(0.05, (now - lastT) / 1000)) : 0;
    lastT = now;

    var t = Date.now();
    var ms = ok ? Math.max(0, TARGET - t) : Infinity;
    // After zero the scene keeps time against the landing instead, if a plane
    // is in the air: calm again at takeoff, hot again on final approach.
    var arr = tracking ? tracker.arrival() : null;
    var left = arr ? Math.max(0, arr.eta - t) : 0;
    var act = ms > 0 ? ms : left;
    showArrival(arr, left);

    if (ok) {
      var d = (ms / 86400000) | 0;
      if (set('d', pad(d))) flip(el.d);
      if (set('h', pad(((ms / 3600000) | 0) % 24))) flip(el.h);
      if (set('m', pad(((ms / 60000) | 0) % 60))) flip(el.m);
      var tick = set('s', pad(((ms / 1000) | 0) % 60));
      set('cs', '.' + pad(((ms % 1000) / 10) | 0));
      if (tick && ms > 0) {
        if (root.getAttribute('data-bg') === 'board') flip(el.s.parentNode);
        if (!firstFrame) Sound.tick(ms <= 10000);
        document.title = (d ? d + 'd ' : '') + last.h + ':' + last.m + ':' + last.s + ' · The Final Countdown';
      }
      Sound.drone(ms > 0 && ms < 60000 ? 1 - ms / 60000 : 0);

      var fin = ms > 0 && ms <= 10000;
      if (fin !== isFinal) {
        isFinal = fin;
        wrap.classList.toggle('is-final', fin);
      }
      if (fin) {
        var n = Math.ceil(ms / 1000);
        if (n !== lastN) {
          lastN = n;
          finalEl.textContent = n;
          pop(finalEl);
        }
      }
    }

    // palette: eased, so the landing countdown taking over at zero glides back
    // to cyan instead of snapping; only written when the rounded hue moves
    var urg = !ok ? 0 : act > 0 ? urgencyFor(act) : 1;
    var want = HUE_CALM + (HUE_HOT - HUE_CALM) * urg;
    hueNow = firstFrame ? want : hueNow + Math.max(-30 * dt, Math.min(30 * dt, want - hueNow));
    var hue = Math.round(hueNow);
    if (hue !== lastHue) {
      lastHue = hue;
      root.style.setProperty('--accent-h', hue);
    }

    if (!reduce) {
      par.x += (aim.x - par.x) * Math.min(1, dt * 4);
      par.y += (aim.y - par.y) * Math.min(1, dt * 4);
    }

    S.dt = dt;
    S.ms = ms;
    S.live = ok && act > 0;
    S.speed = S.live ? speedFor(act) : 14;
    // beat: sharp hit on every whole second, decaying - same clock as the digits
    S.beat = S.live && !reduce ? Math.pow(1 - (act % 1000) / 1000, 4) : 0;
    S.urgency = urg;
    S.hue = hueNow;
    S.px = par.x;
    S.py = par.y;
    S.reduce = reduce;
    // A background is decoration: a bug in one must never stop the clock.
    try { scene.frame(S); }
    catch (e) { if (!sceneErr) { sceneErr = true; console.error(e); } }

    if (ok && ms === 0 && !done) {
      done = true;
      clockEl.classList.add('done');
      document.title = "Time's up";
      Sound.drone(0);
      if (!firstFrame) {
        celebrate();
        notify("Time's up", flightShown ? 'Now tracking ' + flightShown + ' live.' : label, 'fc-zero');
      }
      setTimeout(startTracking, firstFrame ? 0 : 4000);
    }
    firstFrame = false;

    // keeps running past zero so the scene drifts on under TIME'S UP
    requestAnimationFrame(frame);
  }

  frame();
})();
</script>
</body>
</html>
