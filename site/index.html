<script>
/* site/airports.json, fetched once on first use and shared: the tracker (manual
   routes, nearest city) and the globe and departure-board backgrounds all read it. */
window.Airports = (function () {
  var p = null;
  return {
    load: function () {
      return p || (p = fetch('airports.json').then(function (r) {
        if (!r.ok) throw r.status;
        return r.json();
      }).catch(function (e) { p = null; throw e; }));
    }
  };
})();

/* Live flight tracker. Takes over the page at zero when a flight is configured
   (COUNTDOWN_FLIGHT, or ?flight= on the URL). Positions are public ADS-B data
   relayed by nginx (docker/default.conf); the map is Leaflet, fetched only once
   tracking starts so the countdown itself never waits on a third party. */
window.FlightTracker = (function () {
  var POLL_MS = 5000;           // visible tab; the relay caches for 3s anyway
  var POLL_HIDDEN_MS = 30000;   // background tab
  var STALE_S = 60;             // a position older than this = signal lost
  var NEAR_KM = 30;             // "at" an airport
  var KEEP_MS = 36 * 3600e3;    // how long a saved trail survives a reload
  var LEAFLET = 'https://unpkg.com/leaflet@1.9.4/dist/';
  var LEAFLET_SRI = {
    js: 'sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=',
    css: 'sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY='
  };

  // Airline flight numbers ("UA 1") are not what planes broadcast: ADS-B
  // carries the ICAO callsign ("UAL1"). This covers the common airlines.
  // Regional flights sold under a mainline number usually fly under the
  // operator's own callsign (a UA 5xxx is often SKW...), and a few airlines use
  // alphanumeric callsigns - for those, configure the callsign or tail number.
  var IATA_ICAO = {
    AA: 'AAL', UA: 'UAL', DL: 'DAL', WN: 'SWA', AS: 'ASA', B6: 'JBU', NK: 'NKS',
    F9: 'FFT', HA: 'HAL', G4: 'AAY', SY: 'SCX', MX: 'MXY', QX: 'QXE', OO: 'SKW',
    YX: 'RPA', '9E': 'EDV', MQ: 'ENY', OH: 'JIA', YV: 'ASH', ZW: 'AWI', G7: 'GJS',
    PT: 'PDT', C5: 'UCA', AC: 'ACA', WS: 'WJA', PD: 'POE', TS: 'TSC', AM: 'AMX',
    Y4: 'VOI', VB: 'VIV', BA: 'BAW', VS: 'VIR', LH: 'DLH', AF: 'AFR', KL: 'KLM',
    IB: 'IBE', EI: 'EIN', LX: 'SWR', OS: 'AUA', SK: 'SAS', AY: 'FIN', TP: 'TAP',
    U2: 'EZY', FR: 'RYR', W6: 'WZZ', TK: 'THY', EK: 'UAE', QR: 'QTR', EY: 'ETD',
    SQ: 'SIA', CX: 'CPA', NH: 'ANA', JL: 'JAL', KE: 'KAL', OZ: 'AAR', QF: 'QFA',
    NZ: 'ANZ', VA: 'VOZ', BR: 'EVA', CI: 'CAL', CA: 'CCA', MU: 'CES', CZ: 'CSN',
    LA: 'LAN', AV: 'AVA', CM: 'CMP', AR: 'ARG', ET: 'ETH', LY: 'ELY', PR: 'PAL',
    MH: 'MAS', TG: 'THA', GA: 'GIA', AI: 'AIC', '6E': 'IGO', SA: 'SAA', MS: 'MSR',
    SV: 'SVA'
  };

  // "UA 1" -> callsign UAL1; "N81110" / "C-FTJP" -> tail number; else as given.
  function parseIdent(raw) {
    var s = String(raw || '').toUpperCase().replace(/\s+/g, '');
    if (!/^[A-Z0-9-]{2,10}$/.test(s)) return null;
    if (/^[A-Z0-9]{1,2}-[A-Z0-9]{2,5}$/.test(s) || /^N[1-9][0-9A-Z]{0,4}$/.test(s)) {
      return { kind: 'registration', id: s, shown: s };
    }
    var m = /^([A-Z0-9]{2})0*(\d{1,4}[A-Z]?)$/.exec(s);
    if (m && IATA_ICAO[m[1]]) {
      return { kind: 'callsign', id: IATA_ICAO[m[1]] + m[2], shown: m[1] + ' ' + m[2] };
    }
    s = s.replace(/-/g, '');
    return s.length >= 2 ? { kind: 'callsign', id: s, shown: s } : null;
  }

  // ---- geometry (degrees in, km out) ----

  var RAD = Math.PI / 180, EARTH_KM = 6371.0088;

  function distKm(a, b) {
    var dLat = (b.lat - a.lat) * RAD, dLon = (b.lon - a.lon) * RAD;
    var h = Math.pow(Math.sin(dLat / 2), 2) +
            Math.cos(a.lat * RAD) * Math.cos(b.lat * RAD) * Math.pow(Math.sin(dLon / 2), 2);
    return 2 * EARTH_KM * Math.asin(Math.min(1, Math.sqrt(h)));
  }

  // Point `km` along `bearing` from `p` - dead reckoning between fixes.
  function travel(p, bearing, km) {
    var d = km / EARTH_KM, b = bearing * RAD, la = p.lat * RAD, lo = p.lon * RAD;
    var la2 = Math.asin(Math.sin(la) * Math.cos(d) + Math.cos(la) * Math.sin(d) * Math.cos(b));
    var lo2 = lo + Math.atan2(Math.sin(b) * Math.sin(d) * Math.cos(la),
                              Math.cos(d) - Math.sin(la) * Math.sin(la2));
    return { lat: la2 / RAD, lon: lo2 / RAD };
  }

  // The great circle a -> b as n+1 points, which is how the route is drawn.
  function greatCircle(a, b, n) {
    var la1 = a.lat * RAD, lo1 = a.lon * RAD, la2 = b.lat * RAD, lo2 = b.lon * RAD;
    var d = distKm(a, b) / EARTH_KM;
    if (d < 1e-6) return [a, b];
    var out = [];
    for (var i = 0; i <= n; i++) {
      var f = i / n;
      var A = Math.sin((1 - f) * d) / Math.sin(d), B = Math.sin(f * d) / Math.sin(d);
      var x = A * Math.cos(la1) * Math.cos(lo1) + B * Math.cos(la2) * Math.cos(lo2);
      var y = A * Math.cos(la1) * Math.sin(lo1) + B * Math.cos(la2) * Math.sin(lo2);
      var z = A * Math.sin(la1) + B * Math.sin(la2);
      out.push({ lat: Math.atan2(z, Math.sqrt(x * x + y * y)) / RAD, lon: Math.atan2(y, x) / RAD });
    }
    return out;
  }

  // Shifts a longitude by whole turns to sit within 180 degrees of `ref`, so a
  // flight across the date line draws as one line instead of wrapping the map.
  function near(lon, ref) {
    while (lon - ref > 180) lon -= 360;
    while (lon - ref < -180) lon += 360;
    return lon;
  }

  // Initial bearing from a to b, degrees clockwise from north.
  function bearing(a, b) {
    var la1 = a.lat * RAD, la2 = b.lat * RAD, dLon = (b.lon - a.lon) * RAD;
    var y = Math.sin(dLon) * Math.cos(la2);
    var x = Math.cos(la1) * Math.sin(la2) - Math.sin(la1) * Math.cos(la2) * Math.cos(dLon);
    return (Math.atan2(y, x) / RAD + 360) % 360;
  }

  // ---- formatting ----

  var COMPASS = ['north', 'north-northeast', 'northeast', 'east-northeast', 'east',
                 'east-southeast', 'southeast', 'south-southeast', 'south',
                 'south-southwest', 'southwest', 'west-southwest', 'west',
                 'west-northwest', 'northwest', 'north-northwest'];
  var COMPASS8 = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];

  function num(n) { return Math.round(n).toLocaleString('en-US'); }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function isNum(v) { return typeof v === 'number' && isFinite(v); }

  function duration(ms) {
    var m = Math.max(0, Math.round(ms / 60000)), h = (m / 60) | 0;
    return h ? h + 'h ' + pad2(m % 60) + 'm' : m + 'm';
  }

  function ago(s) {
    if (s < 60) return Math.max(0, Math.round(s)) + 's';
    if (s < 3600) return Math.round(s / 60) + 'm';
    return duration(s * 1000);
  }

  function titleCase(s) {
    return String(s).toLowerCase().replace(/\b[a-z]/g, function (c) { return c.toUpperCase(); });
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  // ---- state ----

  // One entry per flight. A connection is followed leg by leg: `cur` is the leg
  // in progress and `view` the one on screen - the same unless the viewer has
  // picked another leg in the itinerary strip.
  var legs = [], cur = 0, view = 0, follow = true, tick = 0;
  var zone, el = {}, routeErr = '';
  var feed = '', feedErr = 0, inflight = false, timer = null, lastPoll = 0, skew = 0;
  var L, map, layers = { routes: [], trails: [] }, userMoved = false;
  var listeners = [], places = null, nearCache = null, altKey = '';

  function newLeg(ident) {
    return {
      ident: ident,
      route: null, routeFor: null, routeState: 'pending', // pending | ok | none
      fix: null,          // latest position: lat, lon, t, ground, alt, gs, track, vr
      ac: null,           // latest raw aircraft record from the feed
      hex: null,          // aircraft this leg is locked onto
      lastNow: 0,         // feed timestamp of the last response used
      airborneSeen: false,
      trail: [],          // [lat, lon, t, altitude ft]
      fetched: false,     // has had at least one answer from the feed this visit
      lastStatus: undefined,
      etaRaw: null, etaSmooth: null,
      done: false
    };
  }

  // "AS 414, AS 488" -> two legs; null if any of them is not a flight.
  function parseTrip(raw) {
    var parts = String(raw || '').split(',').map(function (s) { return s.trim(); })
                                 .filter(Boolean);
    if (!parts.length || parts.length > 4) return null;
    var ids = parts.map(parseIdent);
    return ids.every(Boolean) ? ids : null;
  }

  function legKey(g) { return 'fc-flight:' + g.ident.kind + ':' + g.ident.id; }
  function tripKey() { return 'fc-trip:' + legs.map(function (g) { return g.ident.id; }).join(','); }

  function save(g) {
    try {
      localStorage.setItem(legKey(g), JSON.stringify({
        hex: g.hex, fix: g.fix, airborneSeen: g.airborneSeen, trail: g.trail
      }));
      if (legs.length > 1) localStorage.setItem(tripKey(), JSON.stringify({ cur: cur, t: Date.now() }));
    } catch (e) {}
  }

  function restore() {
    try {
      legs.forEach(function (g) {
        var s = JSON.parse(localStorage.getItem(legKey(g)) || 'null');
        if (!s || !s.fix || Date.now() - s.fix.t > KEEP_MS) return;
        g.hex = s.hex; g.fix = s.fix; g.airborneSeen = !!s.airborneSeen;
        g.trail = (s.trail || []).filter(function (p) { return Date.now() - p[2] < KEEP_MS; });
      });
      var t = JSON.parse(localStorage.getItem(tripKey()) || 'null');
      if (t && Date.now() - t.t < KEEP_MS) cur = view = Math.min(t.cur | 0, legs.length - 1);
      for (var i = 0; i < cur; i++) legs[i].done = true;
    } catch (e) {}
  }

  // ---- data ----

  // The leg on screen is polled every cycle. Every third cycle, a few seconds
  // later (adsb.fi allows one request a second), the active leg's successor is
  // polled too, so a page opened mid-trip - or a first leg that landed out of
  // coverage - still moves on once the next flight is in the air.
  function cycle() {
    if (inflight) return;
    inflight = true;
    clearTimeout(timer);
    lastPoll = Date.now();
    fetchLeg(legs[view], true).then(function () {
      inflight = false;
      advance();
      render();
      var other = view !== cur ? legs[cur] : legs[cur + 1];
      if (other && ++tick % 3 === 0) {
        setTimeout(function () {
          fetchLeg(other, false).then(function () { advance(); render(); });
        }, 2500);
      }
      clearTimeout(timer);
      timer = setTimeout(cycle, document.hidden ? POLL_HIDDEN_MS : POLL_MS);
    });
  }

  function fetchLeg(g, main) {
    return fetch('api/aircraft/' + g.ident.kind + '/' + encodeURIComponent(g.ident.id), { cache: 'no-store' })
      .then(function (r) {
        // A non-JSON 200 or 404 means no relay answered (a plain static server);
        // anything else non-OK is the relay reporting that the feeds are down.
        var json = (r.headers.get('Content-Type') || '').indexOf('json') >= 0;
        if (!json && (r.ok || r.status === 404)) throw 404;
        if (!r.ok || !json) throw r.status || -1;
        feed = r.headers.get('X-Feed') || feed;
        // How far the server's clock is from ours, so feed timestamps can be
        // read on the viewer's clock (a cached reply is then exactly as old as it is).
        var served = Date.parse(r.headers.get('Date') || '');
        skew = isNaN(served) ? 0 : served - Date.now();
        return r.json();
      })
      .then(function (d) { if (main) feedErr = 0; g.fetched = true; onData(g, d); })
      .catch(function (status) { if (main) feedErr = status === 404 ? 404 : (status || -1); });
  }

  function onData(g, d) {
    var list = (d && d.ac) || [];
    var now = d && isNum(d.now) ? (d.now < 1e11 ? d.now * 1000 : d.now) - skew : Date.now();
    if (now === g.lastNow) return; // same cached response as last time
    g.lastNow = now;

    var withPos = list.filter(function (a) { return isNum(a.lat) && isNum(a.lon); });
    if (!withPos.length) {
      if (list.length && !g.ac) g.ac = list[0];
      return;
    }

    // Stay on the aircraft we already follow while it is still reporting. A
    // daily flight number can be on two planes at once (yesterday's long-haul
    // still in the air): prefer the one nearest the origin, i.e. the later one.
    var pick = null;
    for (var i = 0; i < withPos.length; i++) if (withPos[i].hex === g.hex) pick = withPos[i];
    if (!pick) {
      withPos.sort(function (a, b) {
        if (g.route) return distKm(a, g.route.from) - distKm(b, g.route.from);
        return (a.seen_pos || 0) - (b.seen_pos || 0);
      });
      pick = withPos[0];
      if (g.hex && pick.hex !== g.hex) { g.trail = []; g.airborneSeen = false; }
      g.hex = pick.hex;
    }
    g.ac = pick;

    var ground = pick.alt_baro === 'ground';
    var fix = g.fix = {
      lat: pick.lat,
      lon: pick.lon,
      t: Math.min(Date.now(), now - (isNum(pick.seen_pos) ? pick.seen_pos : 0) * 1000),
      ground: ground,
      alt: ground ? 0 : (isNum(pick.alt_baro) ? pick.alt_baro : pick.alt_geom),
      gs: pick.gs,
      track: isNum(pick.track) ? pick.track : pick.true_heading,
      vr: isNum(pick.baro_rate) ? pick.baro_rate : pick.geom_rate
    };
    if (!ground && isNum(fix.gs) && fix.gs > 80) g.airborneSeen = true;

    var lastPt = g.trail[g.trail.length - 1];
    if (!lastPt || fix.t - lastPt[2] > 30000 ||
        distKm(fix, { lat: lastPt[0], lon: lastPt[1] }) > 0.5) {
      g.trail.push([fix.lat, fix.lon, fix.t, isNum(fix.alt) ? Math.round(fix.alt) : null]);
      if (g.trail.length > 6000) g.trail.splice(0, g.trail.length - 6000);
    }

    // Tracking by tail number: the route comes from whatever callsign it flies.
    if (g.ident.kind === 'registration' && pick.flight) fetchRoute(g, pick.flight.trim());

    save(g);
    draw();
  }

  // Moves on to the next leg once this one has landed, or once the next one is
  // already flying (the first leg may have landed out of coverage).
  function advance() {
    var moved = false;
    while (cur < legs.length - 1 &&
           (status(legs[cur])[0] === 'Landed' || legs[cur + 1].airborneSeen)) {
      legs[cur].done = true;
      cur++;
      moved = true;
    }
    if (!moved) return;
    if (follow) { view = cur; userMoved = false; }
    save(legs[cur]);
    drawRoutes();
    draw();
    fit();
  }

  function selectLeg(i) {
    if (i === view || !legs[i]) return;
    view = i;
    follow = i === cur;
    userMoved = false;
    drawRoutes();
    draw();
    fit();
    render();
    cycle();
  }

  function fetchRoute(g, cs) {
    cs = String(cs || '').toUpperCase();
    if (!/^[A-Z0-9]{2,8}$/.test(cs) || cs === g.routeFor || g.routeFor === 'manual') return;
    g.routeFor = cs;
    fetch('api/route/' + cs)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        var fr = d && d.response && d.response.flightroute;
        if (!fr || !fr.origin || !fr.destination) { g.routeState = 'none'; return; }
        var ap = function (a) {
          return { code: a.iata_code || a.icao_code, city: a.municipality || a.name,
                   lat: a.latitude, lon: a.longitude };
        };
        setRoute(g, ap(fr.origin), ap(fr.destination), fr.airline && fr.airline.name, false);
      })
      .catch(function () { g.routeState = 'none'; })
      .then(render);
  }

  // COUNTDOWN_ROUTE, one leg per flight: set by hand, looked up in
  // site/airports.json and trusted over anything adsbdb says. "PIT-SEA-PDX"
  // chains the legs; "PIT-SEA, SEA-PDX" lists them.
  function manualRoutes(spec) {
    var shape = /^[A-Z]{3}(?:(?:\s*(?:-|>|TO)\s*|\s+)[A-Z]{3})+$/;
    var parts = String(spec).toUpperCase().split(',').map(function (s) { return s.trim(); })
                            .filter(Boolean);
    var pairs = null;
    if (parts.length && parts.every(function (p) { return shape.test(p); })) {
      var codes = parts.map(function (p) { return p.match(/\b[A-Z]{3}\b/g); });
      if (codes.length === legs.length && codes.every(function (c) { return c.length === 2; })) {
        pairs = codes;
      } else if (codes.length === 1 && codes[0].length === legs.length + 1) {
        pairs = legs.map(function (g, i) { return [codes[0][i], codes[0][i + 1]]; });
      }
    }
    legs.forEach(function (g) { g.routeFor = 'manual'; });
    if (!pairs) {
      legs.forEach(function (g) { g.routeState = 'none'; });
      routeErr = 'COUNTDOWN_ROUTE should be ' + (legs.length > 1
        ? 'one leg per flight, like <code>PIT-SEA-PDX</code> or <code>PIT-SEA, SEA-PDX</code>'
        : 'two airport codes like <code>SFO-ICN</code>') + ', not <code>' + esc(spec) + '</code>.';
      return;
    }
    window.Airports.load()
      .then(function (db) {
        var bad = [];
        pairs.forEach(function (p) {
          p.forEach(function (c) { if (!db[c] && bad.indexOf(c) < 0) bad.push(c); });
        });
        if (bad.length) {
          legs.forEach(function (g) { g.routeState = 'none'; });
          routeErr = 'COUNTDOWN_ROUTE: no airport with the code <code>' + esc(bad.join(', ')) + '</code>.';
          return;
        }
        var ap = function (c) { return { code: c, city: db[c][2], lat: db[c][0], lon: db[c][1] }; };
        pairs.forEach(function (p, i) { setRoute(legs[i], ap(p[0]), ap(p[1]), null, true); });
      })
      .catch(function () {
        legs.forEach(function (g) { g.routeState = 'none'; });
        routeErr = 'Could not load <code>airports.json</code> for COUNTDOWN_ROUTE.';
      })
      .then(render);
  }

  function setRoute(g, from, to, airline, manual) {
    g.route = { from: from, to: to, airline: airline, manual: manual, km: distKm(from, to) };
    g.routeState = 'ok';
    drawRoutes();
    if (g === legs[view]) fit();
  }

  // adsbdb's routes are crowd-sourced and sometimes out of date. Only trust one
  // while the plane is plausibly between its two airports: the detour via the
  // plane's position must be small next to the route itself.
  function trustedRoute(g) {
    var route = g.route, fix = g.fix;
    if (!route || !fix || route.manual) return route;
    var excess = distKm(route.from, fix) + distKm(fix, route.to) - route.km;
    return excess <= Math.max(150, route.km * 0.25) ? route : null;
  }

  // Where the plane is now: the last fix, dead-reckoned forward for up to two
  // minutes so the marker keeps moving between polls.
  function position(g) {
    var fix = g.fix;
    if (!fix) return null;
    var age = (Date.now() - fix.t) / 1000;
    if (fix.ground || !isNum(fix.gs) || !isNum(fix.track) || age > 120) return fix;
    return travel(fix, fix.track, fix.gs * 1.852 * age / 3600);
  }

  // Status pill: [text, class].
  function status(g) {
    var fix = g.fix, ac = g.ac;
    var prev = legs[legs.indexOf(g) - 1];
    // Previous leg down, this one not yet moving: the connection.
    var layover = prev && prev.done && !g.airborneSeen &&
                  (!fix || (fix.ground && !(fix.gs > 5)));
    if (!fix) {
      if (feedErr === 404) return ['No data relay', 'alert'];
      if (feedErr) return ['Feed offline', 'warn'];
      return layover ? ['Layover', 'ok'] : ['Waiting for signal', 'warn'];
    }
    if (ac && ac.emergency && ac.emergency !== 'none') {
      return ['Emergency ' + (ac.squawk || ''), 'alert'];
    }
    var age = (Date.now() - fix.t) / 1000;
    var rt = trustedRoute(g);
    var atDest = rt && distKm(fix, rt.to) < NEAR_KM;
    var atFrom = rt && distKm(fix, rt.from) < NEAR_KM;
    if (fix.ground || (isNum(fix.gs) && fix.gs < 40 && isNum(fix.alt) && fix.alt < 1500)) {
      if (atDest || (g.airborneSeen && !atFrom)) return ['Landed', 'done'];
      if (layover) return ['Layover', 'ok'];
      return [isNum(fix.gs) && fix.gs > 5 ? 'Taxiing' : 'On the ground', 'ok'];
    }
    if (age > STALE_S) {
      // Lost low on approach almost always means it landed out of coverage.
      if (atDest && isNum(fix.alt) && fix.alt < 3000) return ['Landed', 'done'];
      return ['Signal lost', 'warn'];
    }
    return ['In flight', 'ok'];
  }

  // Estimated landing time of a leg in the air: great-circle distance left at
  // the current ground speed, from its last fix. Null when there is none.
  function etaFor(g) {
    var fix = g.fix, rt = trustedRoute(g);
    if (!rt || !fix || fix.ground || !isNum(fix.gs) || fix.gs * 1.852 <= 150) return null;
    return fix.t + distKm(fix, rt.to) / (fix.gs * 1.852) * 3600e3;
  }

  // Status changes worth telling someone about, per leg, as they happen. The
  // first status seen for a leg on this visit only sets a baseline, so a page
  // opened mid-flight does not announce a takeoff from hours ago.
  var GROUNDED = ['Waiting for signal', 'On the ground', 'Taxiing', 'Layover'];

  function watch() {
    legs.forEach(function (g, i) {
      if (!g.fetched) return;
      var s = status(g)[0], was = g.lastStatus;
      g.lastStatus = s;
      if (was === undefined || was === s) return;
      var type = s === 'In flight' && GROUNDED.indexOf(was) >= 0 ? 'takeoff'
               : s === 'Landed' ? 'landed'
               : s.indexOf('Emergency') === 0 ? 'emergency' : null;
      if (!type) return;
      var eta = type === 'takeoff' ? etaFor(g) : null;
      var e = {
        type: type, leg: i, last: i === legs.length - 1, flight: g.ident.shown, status: s,
        route: trustedRoute(g), eta: eta && clockTime(eta),
        next: legs[i + 1] ? legs[i + 1].ident.shown : null
      };
      listeners.forEach(function (fn) { try { fn(e); } catch (err) {} });
    });
  }

  // The closest town with an airport in site/airports.json - a rough "where is
  // it now" that needs no geocoding service. Recomputed every couple of km.
  function nearest(p) {
    if (!places || !places.length) return null;
    if (nearCache && distKm(p, nearCache.at) < 2) return nearCache;
    var best = null, bd = Infinity;
    for (var i = 0; i < places.length; i++) {
      var d = distKm(p, places[i]);
      if (d < bd) { bd = d; best = places[i]; }
    }
    return (nearCache = { at: { lat: p.lat, lon: p.lon }, place: best, km: bd,
                          dir: COMPASS8[Math.round(bearing(best, p) / 45) % 8] });
  }

  // ---- rendering ----

  function stat(key, value, sub) {
    setText(el.v[key], value);
    setText(el.s[key], sub || '');
  }

  // Writes only on change: render() runs every second, and replacing a link
  // between mousedown and mouseup would swallow the click.
  function setText(node, s) { if (node.textContent !== s) node.textContent = s; }
  function setHTML(node, s) { if (node.getAttribute('data-html') !== s) { node.setAttribute('data-html', s); node.innerHTML = s; } }

  function render() {
    var g = legs[view], fix = g.fix, ac = g.ac, route = g.route;
    var prev = legs[view - 1], next = legs[view + 1];
    var st = status(g);
    var landed = st[0] === 'Landed';
    var age = fix ? (Date.now() - fix.t) / 1000 : 0;
    var rt = trustedRoute(g);
    var doubt = !!route && !rt;

    setText(el.cs, g.ident.shown);
    setText(el.status, st[0]);
    el.status.className = 'fl-status is-' + st[1];

    setHTML(el.route, route
      ? '<b>' + esc(route.from.code) + '</b> ' + esc(route.from.city) +
        '<span class="arrow">&rarr;</span>' +
        '<b>' + esc(route.to.code) + '</b> ' + esc(route.to.city)
      : '');
    el.route.classList.toggle('doubt', doubt);
    el.map.classList.toggle('route-doubt', doubt);

    if (legs.length > 1) {
      setHTML(el.legs, legs.map(function (x, i) {
        var state = x.done ? 'done' : i === cur ? 'now' : 'next';
        return '<button type="button" class="fl-leg is-' + state + (i === view ? ' is-viewed' : '') +
          '" data-leg="' + i + '"' + (i === view ? ' aria-current="true"' : '') + '>' +
          '<span class="fl-leg-n">' + (x.done ? '&#x2713;' : i + 1) + '</span>' + esc(x.ident.shown) +
          (x.route ? ' <small>' + esc(x.route.from.code) + ' &rarr; ' + esc(x.route.to.code) + '</small>' : '') +
          '</button>';
      }).join('<span class="fl-leg-sep" aria-hidden="true"></span>'));
    }

    var note = '';
    if (st[0] === 'Layover') {
      note = esc(prev.ident.shown) + ' has landed' +
             (prev.route ? ' in ' + esc(prev.route.to.city) : '') + '. Next up: ' + esc(g.ident.shown) +
             (route ? ' to ' + esc(route.to.city) : '') + ', picked up as soon as its transponder ' +
             'comes on - usually at the gate or on pushback.';
    } else if (!fix) {
      if (feedErr === 404) {
        note = 'The page cannot reach its flight-data relay (<code>/api/aircraft</code>). ' +
               'It is part of the Docker image - serving <code>site/</code> on its own has no relay.';
      } else if (feedErr) {
        note = 'The ADS-B feeds are not answering right now. Retrying every few seconds.';
      } else {
        var id = g.ident;
        note = esc(id.shown) + ' is not on ADS-B yet' +
               (id.kind === 'callsign' && id.id !== id.shown ? ' (callsign ' + esc(id.id) + ')' : '') +
               '. It shows up once its transponder is on and a receiver picks it up - usually at the gate ' +
               'or on the taxi out. Checking every few seconds.';
      }
    } else if (st[0] === 'Signal lost') {
      note = 'No position for ' + ago(age) + '. Planes drop out of ADS-B coverage over oceans and remote ' +
             'areas; numbers below are estimated from the last report until it is picked up again.';
    }
    if (doubt) {
      note += (note ? ' ' : '') + 'The route on file for this callsign (' + esc(route.from.code) +
              ' &rarr; ' + esc(route.to.code) + ') does not match where the plane is, so distance ' +
              'and arrival are not shown. Set <code>COUNTDOWN_ROUTE</code> to fix it.';
    }
    if (routeErr) note += (note ? ' ' : '') + routeErr;
    setHTML(el.note, note);
    el.note.hidden = !note;

    // altitude / speed / heading
    if (!fix) {
      stat('alt', '—'); stat('spd', '—'); stat('hdg', '—');
    } else if (fix.ground) {
      stat('alt', 'Ground', landed && rt ? 'at ' + rt.to.code : '');
      stat('spd', isNum(fix.gs) ? num(fix.gs) + ' kt' : '—', isNum(fix.gs) && fix.gs > 5 ? num(fix.gs * 1.15078) + ' mph' : 'stopped');
      stat('hdg', isNum(fix.track) ? Math.round(fix.track) + '°' : '—', isNum(fix.track) ? COMPASS[Math.round(fix.track / 22.5) % 16] : '');
    } else {
      var vr = isNum(fix.vr) ? fix.vr : 0;
      stat('alt', isNum(fix.alt) ? num(fix.alt) + ' ft' : '—',
           vr > 300 ? '▲ climbing ' + num(vr) + ' ft/min'
           : vr < -300 ? '▼ descending ' + num(-vr) + ' ft/min' : 'level');
      stat('spd', isNum(fix.gs) ? num(fix.gs) + ' kt' : '—',
           isNum(fix.gs) ? num(fix.gs * 1.15078) + ' mph · ' + num(fix.gs * 1.852) + ' km/h' : '');
      stat('hdg', isNum(fix.track) ? Math.round(fix.track) + '°' : '—',
           isNum(fix.track) ? COMPASS[Math.round(fix.track / 22.5) % 16] : '');
    }

    // distance, progress and arrival - only with a known route
    var progress = null;
    var then = next ? ' · then ' + next.ident.shown : ' · straight line at current speed';
    if (rt && fix) {
      var remKm = distKm(fix, rt.to);
      var kmh = isNum(fix.gs) ? fix.gs * 1.852 : 0;
      var flying = !fix.ground && kmh > 150 && !landed;
      var remNow = landed ? 0 : flying ? Math.max(0, remKm - kmh * age / 3600) : remKm;
      var est = flying && age > STALE_S ? '≈ ' : '';
      stat('dist', est + num(remNow * 0.621371) + ' mi',
           num(remNow) + ' km · of ' + num(rt.km * 0.621371) + ' mi');
      progress = landed ? 1 : Math.min(1, Math.max(0, 1 - remNow / rt.km));
      if (landed) {
        stat('eta', 'Arrived', rt.to.city + (next ? ' · next: ' + next.ident.shown : ''));
      } else if (flying) {
        var eta = fix.t + remKm / kmh * 3600e3;
        stat('eta', clockTime(eta), 'in ' + duration(eta - Date.now()) + then);
      } else {
        stat('eta', '—', 'once airborne');
      }
    } else if (route && !doubt) {
      // Layover or waiting: the route is known, the plane just is not moving yet.
      stat('dist', num(route.km * 0.621371) + ' mi', num(route.km) + ' km · ' + route.from.code +
           ' → ' + route.to.code);
      stat('eta', '—', 'once airborne');
    } else {
      var why = !fix ? '' : doubt ? 'route on file looks wrong'
              : g.routeState === 'pending' ? 'looking up route' : 'route unknown';
      stat('dist', '—', why);
      stat('eta', '—', why);
    }
    el.progress.hidden = progress === null;
    if (progress !== null) el.bar.style.width = (progress * 100).toFixed(2) + '%';

    if (ac) {
      stat('ac', ac.desc ? titleCase(ac.desc) : ac.t || '—',
           [ac.r, ac.ownOp ? titleCase(ac.ownOp) : (route && route.airline)].filter(Boolean).join(' · '));
    } else {
      stat('ac', '—', '');
    }

    var near = fix && nearest(position(g) || fix);
    if (near) {
      var mi = near.km * 0.621371;
      stat('near', near.place.city, near.place.code + ' · ' +
           (mi < 8 ? 'right overhead' : num(mi) + ' mi ' + near.dir + ' of town'));
    } else {
      stat('near', '—', !fix ? '' : places ? 'airport list unavailable' : 'looking up places');
    }

    setText(el.altNow, !fix ? '' : fix.ground ? 'on the ground'
                       : isNum(fix.alt) ? num(fix.alt) + ' ft' : '');
    drawAlt(g);
    watch();

    var foot = [];
    if (fix) foot.push('Position ' + ago(age) + ' old');
    if (ac && ac.squawk) foot.push('squawk ' + esc(ac.squawk));
    if (ac && ac.flight && ac.flight.trim()) foot.push('callsign ' + esc(ac.flight.trim()));
    if (feed) {
      foot.push('ADS-B via <a href="https://' + feed + '" target="_blank" rel="noopener">' + feed + '</a>');
    }
    if (route && !route.manual) foot.push('route via <a href="https://www.adsbdb.com" target="_blank" rel="noopener">adsbdb</a>');
    if (g.hex) foot.push('<a href="https://globe.adsb.fi/?icao=' + esc(g.hex) + '" target="_blank" rel="noopener">open in a full tracker</a>');
    setHTML(el.foot, foot.join(' · '));

    var title = g.ident.shown + ' · ' +
      (fix && !fix.ground && isNum(fix.alt) && st[0] === 'In flight' ? num(fix.alt) + ' ft' : st[0]);
    if (document.title !== title) document.title = title;

    drawPlane();
  }

  function shortTime(ms) {
    var o = { hour: 'numeric', minute: '2-digit' };
    if (zone) o.timeZone = zone;
    try { return new Date(ms).toLocaleTimeString(undefined, o); }
    catch (e) { return new Date(ms).toLocaleTimeString(); }
  }

  // ---- altitude chart ----

  // Altitude over the leg on screen: climb, cruise, descent. Redrawn only when
  // its trail grows, another leg is picked or the panel changes width. A gap of
  // more than ten minutes (out of coverage) is left as a gap, not bridged.
  var ALT_H = 130, ALT_TOP = 14, ALT_BOT = 16;

  function drawAlt(g) {
    var pts = g.trail.filter(function (p) { return isNum(p[3]); });
    var w = Math.round(el.altSvg.getBoundingClientRect().width || el.alt.clientWidth || 600);
    var key = view + ':' + pts.length + ':' + w;
    if (key === altKey) return;
    altKey = key;
    el.altTip.hidden = true;
    if (pts.length < 2) {
      el.altPts = null;
      el.altSvg.setAttribute('hidden', '');
      el.altEmpty.hidden = false;
      return;
    }
    el.altSvg.removeAttribute('hidden');   // (an <svg> has no .hidden property)
    el.altEmpty.hidden = true;

    var t0 = pts[0][2], t1 = pts[pts.length - 1][2], top = 0;
    pts.forEach(function (p) { if (p[3] > top) top = p[3]; });
    top = Math.max(10000, Math.ceil(top / 10000) * 10000);
    var X = function (t) { return t1 > t0 ? (t - t0) / (t1 - t0) * w : 0; };
    var Y = function (a) { return ALT_TOP + (1 - Math.max(0, a) / top) * (ALT_H - ALT_TOP - ALT_BOT); };
    var base = Y(0).toFixed(1), line = '', area = '', run = [];
    function flush() {
      if (run.length > 1) {
        line += 'M' + run.join('L');
        area += 'M' + run[0][0] + ',' + base + 'L' + run.join('L') + 'L' + run[run.length - 1][0] + ',' + base + 'Z';
      }
      run = [];
    }
    pts.forEach(function (p, i) {
      if (i && p[2] - pts[i - 1][2] > 10 * 60e3) flush();
      run.push([X(p[2]).toFixed(1), Y(p[3]).toFixed(1)]);
    });
    flush();

    var grid = [top, top / 2, 0].map(function (a) {
      var y = Y(a).toFixed(1);
      return '<line class="gl" x1="0" x2="' + w + '" y1="' + y + '" y2="' + y + '"/>' +
             (a ? '<text class="ax" x="0" y="' + (y - 4) + '">' + num(a) + ' ft</text>' : '');
    }).join('');
    var times = '<text class="ax" x="0" y="' + (ALT_H - 2) + '">' + esc(shortTime(t0)) + '</text>' +
                '<text class="ax" x="' + w + '" y="' + (ALT_H - 2) + '" text-anchor="end">' + esc(shortTime(t1)) + '</text>';
    el.altSvg.setAttribute('viewBox', '0 0 ' + w + ' ' + ALT_H);
    el.altSvg.setAttribute('aria-label', 'Altitude from ' + shortTime(t0) + ' to ' + shortTime(t1) +
                           ', highest ' + num(Math.max.apply(null, pts.map(function (p) { return p[3]; }))) + ' ft');
    el.altSvg.innerHTML = grid + times + '<path class="ar" d="' + area + '"/><path class="ln" d="' + line + '"/>' +
      '<g class="hov" style="display:none"><line class="xh" y1="' + ALT_TOP + '" y2="' + base + '"/><circle class="dot" r="4"/></g>';
    el.altPts = pts;
    el.altX = X; el.altY = Y; el.altW = w;
    if (el.altHov) altHover(el.altHov);   // a reading arrived under a resting pointer
  }

  // Crosshair and tooltip on the nearest reading to the pointer.
  function altHover(e) {
    var pts = el.altPts;
    el.altHov = { clientX: e.clientX };
    if (!pts) return;
    var r = el.altSvg.getBoundingClientRect(), box = el.alt.getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width * el.altW, best = pts[0], bd = Infinity;
    pts.forEach(function (p) { var d = Math.abs(el.altX(p[2]) - x); if (d < bd) { bd = d; best = p; } });
    var px = el.altX(best[2]), py = el.altY(best[3]);
    var hov = el.altSvg.querySelector('.hov');
    hov.style.display = '';
    var xh = hov.firstChild, dot = hov.lastChild;
    xh.setAttribute('x1', px); xh.setAttribute('x2', px);
    dot.setAttribute('cx', px); dot.setAttribute('cy', py);
    el.altTip.textContent = (best[3] > 0 ? num(best[3]) + ' ft' : 'Ground') + ' · ' + shortTime(best[2]);
    el.altTip.hidden = false;
    var left = r.left - box.left + px / el.altW * r.width;
    el.altTip.style.left = Math.max(70, Math.min(box.width - 70, left)) + 'px';
    el.altTip.style.top = (r.top - box.top + py / ALT_H * r.height - 10) + 'px';
  }

  function altLeave() {
    el.altHov = null;
    el.altTip.hidden = true;
    var hov = el.altSvg.querySelector('.hov');
    if (hov) hov.style.display = 'none';
  }

  function clockTime(ms) {
    var o = { hour: 'numeric', minute: '2-digit', timeZoneName: 'short' };
    if (zone) o.timeZone = zone;
    var d = new Date(ms), s;
    try { s = d.toLocaleTimeString(undefined, o); } catch (e) { s = d.toLocaleTimeString(); }
    if (ms - Date.now() > 18 * 3600e3) {
      try { s = d.toLocaleDateString(undefined, { weekday: 'short', timeZone: zone || undefined }) + ' ' + s; }
      catch (e) {}
    }
    return s;
  }

  // ---- map ----

  // Every point is drawn relative to one reference longitude, so a trip across
  // the date line stays one continuous picture.
  function refLon() {
    for (var i = 0; i < legs.length; i++) if (legs[i].route) return legs[i].route.from.lon;
    var f = legs[view] && legs[view].fix;
    return f ? f.lon : 0;
  }

  function ll(p) { return [p.lat, near(p.lon, refLon())]; }

  function loadLeaflet() {
    if (window.L) return initMap();
    var css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = LEAFLET + 'leaflet.css';
    css.integrity = LEAFLET_SRI.css;
    css.crossOrigin = 'anonymous';
    document.head.appendChild(css);

    var js = document.createElement('script');
    js.src = LEAFLET + 'leaflet.js';
    js.integrity = LEAFLET_SRI.js;
    js.crossOrigin = 'anonymous';
    js.onload = initMap;
    js.onerror = function () {
      el.map.innerHTML = '<div class="map-msg">Map unavailable - the live numbers still update</div>';
    };
    document.head.appendChild(js);
  }

  function initMap() {
    L = window.L;
    el.map.innerHTML = '';
    map = L.map(el.map, { zoomSnap: 0.25, worldCopyJump: false }).setView([30, -40], 2);
    // Standard OpenStreetMap tiles (no key), turned dark by the CSS filter on
    // .leaflet-tile-pane. Their usage policy wants attribution and light use -
    // one page following one plane is well inside it.
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    layers.airports = L.layerGroup().addTo(map);

    var Fit = L.Control.extend({
      options: { position: 'topleft' },
      onAdd: function () {
        var bar = L.DomUtil.create('div', 'leaflet-bar');
        var a = L.DomUtil.create('a', '', bar);
        a.href = '#';
        a.title = 'Show the whole flight';
        a.setAttribute('role', 'button');
        a.innerHTML = '&#x2922;';
        L.DomEvent.disableClickPropagation(bar);
        L.DomEvent.on(a, 'click', function (e) {
          L.DomEvent.preventDefault(e);
          userMoved = false;
          fit();
        });
        return bar;
      }
    });
    map.addControl(new Fit());
    map.on('dragstart', function () { userMoved = true; });

    drawRoutes();
    draw();
    fit();
  }

  // Planned routes for every leg: the one on screen bright, flown legs solid
  // and dim, legs still to come dashed and dim.
  function drawRoutes() {
    if (!map) return;
    layers.routes.forEach(function (l) { if (l) map.removeLayer(l); });
    layers.routes = [];
    layers.airports.clearLayers();
    var labelled = {};
    legs.forEach(function (g, i) {
      if (!g.route) return;
      var prev = refLon();
      layers.routes[i] = L.polyline(greatCircle(g.route.from, g.route.to, 128).map(function (p) {
        prev = near(p.lon, prev);
        return [p.lat, prev];
      }), {
        className: 'fl-route-line' + (i === view ? ' is-viewed' : g.done ? ' is-done' : ''),
        weight: 2,
        interactive: false
      }).addTo(map);
      // Label each airport on the side away from the other end of its leg, so
      // a short hop (SEA-PDX) does not stack its two labels on each other.
      var north = g.route.to.lat >= g.route.from.lat;
      [[g.route.from, north ? 'bottom' : 'top'], [g.route.to, north ? 'top' : 'bottom']].forEach(function (x) {
        if (labelled[x[0].code]) return;
        labelled[x[0].code] = true;
        L.circleMarker(ll(x[0]), { radius: 4, weight: 2, className: 'fl-ap', interactive: false })
          .bindTooltip(x[0].code, { permanent: true, direction: x[1], offset: [0, x[1] === 'top' ? -6 : 6],
                                    className: 'fl-ap-tip' })
          .addTo(layers.airports);
      });
    });
  }

  function draw() {
    if (!map) return;
    legs.forEach(function (g, i) {
      if (!layers.trails[i]) {
        layers.trails[i] = L.polyline([], { className: 'fl-trail-line', weight: 3, interactive: false }).addTo(map);
      }
      layers.trails[i].setLatLngs(g.trail.map(function (p) { return ll({ lat: p[0], lon: p[1] }); }));
      var path = layers.trails[i].getElement();
      if (path) path.classList.toggle('is-dim', i !== view);
    });
    if (legs[view].fix && !layers.plane) fit();
    drawPlane();
  }

  var PLANE_SVG =
    '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5c.8 0 ' +
    '1.3 1 1.3 2.3v5.3l8.2 4.6v2l-8.2-2.5v5l2.3 1.7v1.6L12 20.6l-3.6 .9v-1.6l2.3-1.7v-5L2.5 ' +
    '15.7v-2l8.2-4.6V3.8c0-1.3.5-2.3 1.3-2.3z"/></svg>';

  // The plane of the leg on screen; none while that leg has not been seen.
  function drawPlane() {
    if (!map) return;
    var g = legs[view], pos = position(g);
    if (!pos) {
      if (layers.plane) { map.removeLayer(layers.plane); layers.plane = null; }
      return;
    }
    var at = ll(pos);
    if (!layers.plane) {
      layers.plane = L.marker(at, {
        interactive: false,
        keyboard: false,
        icon: L.divIcon({ className: '', iconSize: [30, 30], iconAnchor: [15, 15],
                          html: '<div class="fl-plane">' + PLANE_SVG + '</div>' })
      }).addTo(map);
    } else {
      layers.plane.setLatLng(at);
    }
    var icon = layers.plane.getElement() && layers.plane.getElement().firstChild;
    if (icon) {
      icon.style.transform = 'rotate(' + (isNum(g.fix.track) ? g.fix.track : 0) + 'deg)';
      icon.classList.toggle('stale', (Date.now() - g.fix.t) / 1000 > STALE_S);
    }
    // Keep the plane in view unless the viewer has panned away themselves.
    if (!userMoved && !map.getBounds().pad(-0.08).contains(at)) fit();
  }

  // Frames the leg on screen: its route and plane.
  function fit() {
    if (!map) return;
    var g = legs[view], pts = [];
    if (trustedRoute(g) && layers.routes[view]) {
      layers.routes[view].getLatLngs().forEach(function (p) { pts.push(p); });
    }
    var pos = position(g);
    if (pos) pts.push(ll(pos));
    if (!pts.length) return;
    if (pts.length === 1) map.setView(pts[0], 8);
    else map.fitBounds(L.latLngBounds(pts), { padding: [36, 36], maxZoom: 9 });
  }

  // ---- entry points ----

  return {
    // The flights as written on a ticket ("AS 414"), or null if invalid.
    legsOf: function (raw) {
      var ids = parseTrip(raw);
      return ids && ids.map(function (id) { return id.shown; });
    },

    // What the countdown shows under the clock before zero, or null if invalid.
    describe: function (raw) {
      var shown = this.legsOf(raw);
      return shown && shown.join(' → ');
    },

    // fn({type: 'takeoff' | 'landed' | 'emergency', leg, last, flight, route, eta, next})
    on: function (fn) { listeners.push(fn); },

    // Status text of every leg, for the departure board.
    statuses: function () { return legs.map(function (g) { return status(g)[0]; }); },

    // The landing the page counts down to after zero: the leg in progress, while
    // it is in the air. Each new fix nudges the estimate rather than jumping it,
    // so the digits do not lurch by a minute every five seconds.
    arrival: function () {
      var g = legs[cur];
      if (!g) return null;
      var st = status(g)[0];
      var raw = st === 'In flight' || st === 'Signal lost' ? etaFor(g) : null;
      if (raw === null) { g.etaSmooth = g.etaRaw = null; return null; }
      if (g.etaSmooth === null || Math.abs(raw - g.etaSmooth) > 20 * 60e3) g.etaSmooth = raw;
      else if (raw !== g.etaRaw) g.etaSmooth += (raw - g.etaSmooth) * 0.25;
      g.etaRaw = raw;
      var to = trustedRoute(g).to;
      return { eta: g.etaSmooth, leg: cur, legs: legs.length, last: cur === legs.length - 1,
               city: to.city, code: to.code };
    },

    start: function (raw, opts) {
      var ids = parseTrip(raw);
      if (!ids) return false;
      legs = ids.map(newLeg);
      zone = (opts && opts.tz) || '';

      el.section = document.getElementById('flight');
      el.cs = document.getElementById('flCs');
      el.status = document.getElementById('flStatus');
      el.route = document.getElementById('flRoute');
      el.legs = document.getElementById('flLegs');
      el.progress = document.getElementById('flProgress');
      el.bar = document.getElementById('flBar');
      el.note = document.getElementById('flNote');
      el.map = document.getElementById('flMap');
      el.foot = document.getElementById('flFoot');
      el.alt = document.getElementById('flAlt');
      el.altSvg = document.getElementById('flAltSvg');
      el.altNow = document.getElementById('flAltNow');
      el.altEmpty = document.getElementById('flAltEmpty');
      el.altTip = document.getElementById('flAltTip');
      el.v = {}; el.s = {};
      var vs = el.section.querySelectorAll('[data-v]');
      for (var i = 0; i < vs.length; i++) {
        var k = vs[i].getAttribute('data-v');
        el.v[k] = vs[i];
        el.s[k] = el.section.querySelector('[data-s="' + k + '"]');
      }

      el.section.hidden = false;
      el.section.parentNode.classList.add('has-flight');
      el.legs.hidden = legs.length < 2;
      el.legs.addEventListener('click', function (e) {
        var b = e.target.closest && e.target.closest('[data-leg]');
        if (b) selectLeg(+b.getAttribute('data-leg'));
      });

      el.altSvg.addEventListener('pointermove', altHover);
      el.altSvg.addEventListener('pointerdown', altHover);
      el.altSvg.addEventListener('pointerleave', altLeave);
      window.addEventListener('resize', function () { altKey = ''; });

      window.Airports.load().then(function (db) {
        places = Object.keys(db).map(function (c) {
          return { code: c, lat: db[c][0], lon: db[c][1], city: db[c][2] };
        });
      }).catch(function () { places = []; });

      restore();
      if (opts && opts.route) manualRoutes(opts.route);
      else legs.forEach(function (g) { if (g.ident.kind === 'callsign') fetchRoute(g, g.ident.id); });
      render();
      loadLeaflet();
      cycle();

      setInterval(render, 1000);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden && Date.now() - lastPoll > POLL_MS) cycle();
      });
      return true;
    }
  };
})();
</script>

<script>
/* Backgrounds. Each one is driven once a frame by the countdown with the same
   signals: S.beat (a hit on every whole second), S.speed (the ramp, px/s, ~18 a
   week out to ~900 at the end), S.urgency (0 a day out, 1 at zero) and S.hue,
   plus S.px / S.py (pointer or tilt, -1..1) for parallax. Each may also take
   poke(x, y) for a tap, drag(dx, dy, end) for a drag, zero() for the moment
   itself, resize() and stop(). Picked by COUNTDOWN_BG, ?bg= or the picker. */
window.Scenes = (function () {
  var LIST = [
    ['synthwave', 'Synthwave'],
    ['hyperspace', 'Hyperspace'],
    ['globe', 'Globe'],
    ['board', 'Departure board'],
    ['aurora', 'Northern lights']
  ];
  var RAD = Math.PI / 180;
  var make = {};

  function layer(cls) {
    var d = document.createElement('div');
    d.className = 'scene ' + cls;
    d.setAttribute('aria-hidden', 'true');
    document.body.insertBefore(d, document.body.firstChild);
    return d;
  }

  function add(host, cls) {
    var d = document.createElement('div');
    d.className = cls;
    host.appendChild(d);
    return d;
  }

  // A canvas filling the scene at `k` canvas pixels per CSS pixel (default:
  // the device's, capped at 2).
  function canvas(host, fixedK) {
    var c = document.createElement('canvas');
    host.appendChild(c);
    var o = { c: c, ctx: c.getContext('2d'), w: 0, h: 0, k: 1 };
    o.fit = function () {
      o.k = fixedK || Math.min(2, window.devicePixelRatio || 1);
      var w = Math.max(1, Math.round(innerWidth * o.k)), h = Math.max(1, Math.round(innerHeight * o.k));
      if (w !== o.w || h !== o.h) { c.width = o.w = w; c.height = o.h = h; }
    };
    o.fit();
    return o;
  }

  function hsla(h, s, l, a) { return 'hsla(' + h.toFixed(1) + ',' + s + '%,' + l + '%,' + a.toFixed(3) + ')'; }
  function ease(f) { return f < 0.5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2; }

  // Route codes from COUNTDOWN_ROUTE, in order, consecutive repeats dropped:
  // "PIT-SEA, SEA-PDX" and "PIT-SEA-PDX" are both [PIT, SEA, PDX].
  function routeCodes(spec) {
    var out = [];
    (String(spec || '').toUpperCase().match(/\b[A-Z]{3}\b/g) || []).forEach(function (c) {
      if (c !== 'TO' && out[out.length - 1] !== c) out.push(c);
    });
    return out;
  }

  // ---------- synthwave: the original CSS scene, already in the page ----------

  make.synthwave = function () {
    var host = document.getElementById('sceneSynth');
    var sky = host.querySelector('.sky'), stars = host.querySelector('.stars'), sun = host.querySelector('.sun');
    var glow = document.getElementById('sunGlow'), horizon = document.getElementById('horizon');
    var grid = document.getElementById('grid');
    var TILE = 72;   // grid tile size, must match the CSS gradients
    var TILT = 80;   // floor rake, must match the CSS transform
    var offset = 0, kick = 0, lit = true;
    host.hidden = false;

    return {
      frame: function (S) {
        if (!S.reduce) {
          // grid scroll - transform only, so it stays on the compositor
          offset = (offset + S.speed * S.dt) % TILE;
          grid.style.transform = 'rotateX(' + TILT + 'deg) translate3d(' +
            (S.px * -40).toFixed(1) + 'px,' + offset.toFixed(2) + 'px,0)';
          var t = (S.px * -18).toFixed(1) + 'px ' + (S.py * -8).toFixed(1) + 'px';
          sun.style.translate = t;
          glow.style.translate = t;
          stars.style.translate = (S.px * -7).toFixed(1) + 'px ' + (S.py * -4).toFixed(1) + 'px';
        }
        // beat: the horizon and the sun's bloom pulse; a tap adds a flash of its own
        kick = Math.max(0, kick - S.dt * 2.5);
        var beat = Math.max(S.beat, kick);
        if (beat > 0 || lit) {
          lit = beat > 0;
          glow.style.opacity = (0.32 + 0.5 * beat).toFixed(3);
          horizon.style.opacity = (0.72 + 0.28 * beat).toFixed(3);
          horizon.style.transform = 'scaleY(' + (1 + 2.4 * beat).toFixed(3) + ')';
        }
      },

      // A shooting star from the tap (or above it, for a tap on the floor).
      poke: function (x, y) {
        kick = 0.8;
        var r = sky.getBoundingClientRect();
        if (y > r.bottom - 30) y = r.top + r.height * (0.15 + Math.random() * 0.4);
        var s = document.createElement('i');
        s.className = 'shoot';
        s.style.left = (x - r.left) + 'px';
        s.style.top = (y - r.top) + 'px';
        sky.appendChild(s);
        if (!s.animate) { s.remove(); return; }
        var ang = 140 + Math.random() * 25, d = 260 + Math.random() * 220;
        var dx = Math.cos(ang * RAD) * d, dy = Math.sin(ang * RAD) * d, rot = ' rotate(' + ang + 'deg)';
        s.animate([
          { transform: 'translate(0,0)' + rot + ' scaleX(0.1)', opacity: 0 },
          { transform: 'translate(' + dx * 0.2 + 'px,' + dy * 0.2 + 'px)' + rot + ' scaleX(1)', opacity: 1, offset: 0.2 },
          { transform: 'translate(' + dx + 'px,' + dy + 'px)' + rot + ' scaleX(0.5)', opacity: 0 }
        ], { duration: 900, easing: 'ease-in' }).onfinish = function () { s.remove(); };
      },

      // The sun flares, the horizon blows out, then both settle.
      zero: function () {
        if (!glow.animate) return;
        glow.animate([{ opacity: 1, scale: '1' }, { opacity: 1, scale: '1.9', offset: 0.25 },
                      { opacity: 0.32, scale: '1' }], { duration: 3200, easing: 'ease-out' });
        sun.animate([{ filter: 'none' }, { filter: 'brightness(1.7) saturate(1.3)', offset: 0.2 },
                     { filter: 'none' }], { duration: 3200 });
        horizon.animate([{ transform: 'scaleY(7)', opacity: 1 }, { transform: 'scaleY(1)', opacity: 0.72 }],
                        { duration: 1800, easing: 'ease-out' });
      },

      stop: function () {
        host.hidden = true;
        [grid, sun, glow, stars, horizon].forEach(function (n) { n.removeAttribute('style'); });
      }
    };
  };

  // ---------- hyperspace: a starfield that ends in light-speed streaks ----------

  make.hyperspace = function () {
    var host = layer('bg-hyperspace');
    var cv = canvas(host);
    add(host, 'scrim');
    var stars = [], sparks = [], vel = 0.05, boost = 0;

    function spawn(s, z) {
      s.x = (Math.random() * 2 - 1) * 1.1;
      s.y = (Math.random() * 2 - 1) * 1.1;
      s.z = z;
      s.tint = Math.random();
      return s;
    }
    for (var i = 0; i < 650; i++) stars.push(spawn({}, 0.05 + Math.random() * 0.95));

    return {
      frame: function (S) {
        var ctx = cv.ctx, w = cv.w, h = cv.h, k = cv.k;
        // depth units per second: a slow drift weeks out, a blur at the end
        var want = S.reduce ? 0 : S.live ? 0.03 + Math.pow(S.speed / 900, 1.15) * 2.4 : 0.03;
        vel += (want - vel) * Math.min(1, S.dt * (vel > want ? 0.8 : 3));
        boost = Math.max(0, boost - S.dt * 1.4);
        var v = vel + boost;
        var cx = w / 2 - S.px * w * 0.06, cy = h / 2 - S.py * h * 0.06, f = Math.max(w, h) * 0.5;

        ctx.globalCompositeOperation = 'source-over';
        ctx.clearRect(0, 0, w, h);
        var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, f * 0.9);
        g.addColorStop(0, hsla(S.hue, 100, 60, 0.1 + 0.16 * S.beat));
        g.addColorStop(0.45, hsla((S.hue + 60) % 360, 100, 50, 0.04));
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);

        ctx.globalCompositeOperation = 'lighter';
        ctx.lineCap = 'round';
        var tail = Math.min(0.35, v * 0.07);
        for (var i = 0; i < stars.length; i++) {
          var s = stars[i];
          s.z -= v * S.dt;
          if (s.z <= 0.02) spawn(s, 1);
          var sx = cx + s.x / s.z * f, sy = cy + s.y / s.z * f;
          if (sx < -40 || sx > w + 40 || sy < -40 || sy > h + 40) { spawn(s, 1); continue; }
          var tz = s.z + tail, near = 1 - s.z;
          var a = Math.min(1, near * near * 1.6 + 0.08);
          ctx.strokeStyle = s.tint < 0.7 ? 'rgba(235,245,255,' + a.toFixed(3) + ')'
                          : hsla(s.tint < 0.85 ? S.hue : 320, 100, 75, a);
          ctx.lineWidth = (0.6 + near * 2.2) * k;
          ctx.beginPath();
          ctx.moveTo(cx + s.x / tz * f, cy + s.y / tz * f);
          ctx.lineTo(sx + 0.01, sy);
          ctx.stroke();
        }

        for (i = sparks.length - 1; i >= 0; i--) {
          var p = sparks[i];
          p.life -= S.dt * 1.3;
          if (p.life <= 0) { sparks.splice(i, 1); continue; }
          p.x += p.vx * S.dt; p.y += p.vy * S.dt;
          ctx.strokeStyle = hsla(p.hue, 100, 75, p.life);
          ctx.lineWidth = 1.6 * k;
          ctx.beginPath();
          ctx.moveTo(p.x - p.vx * 0.04, p.y - p.vy * 0.04);
          ctx.lineTo(p.x, p.y);
          ctx.stroke();
        }
      },

      // A burst of sparks from the tap, and a jolt forward.
      poke: function (x, y) {
        boost = Math.min(2.5, boost + 1.2);
        for (var i = 0; i < 36; i++) {
          var a = Math.random() * Math.PI * 2, sp = (120 + Math.random() * 380) * cv.k;
          sparks.push({ x: x * cv.k, y: y * cv.k, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1,
                        hue: Math.random() < 0.5 ? 186 : 320 });
        }
      },

      // One last surge, then out of warp: the streaks shrink back to stars.
      zero: function () { boost = 4; },

      resize: function () { cv.fit(); },
      stop: function () { host.remove(); }
    };
  };

  // ---------- globe: Earth turning, with the trip drawn on it ----------

  // Land outlines: world-atlas (Natural Earth, public domain), 110m, ~55 KB.
  var LAND = 'https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json';

  function vec(lon, lat) {
    var a = lon * RAD, b = lat * RAD;
    return [Math.cos(b) * Math.cos(a), Math.cos(b) * Math.sin(a), Math.sin(b)];
  }

  // TopoJSON -> rings of unit vectors. Just enough of the format for one file:
  // quantized, delta-encoded arcs, and Polygon / MultiPolygon geometries.
  function decodeLand(topo) {
    var tf = topo.transform;
    var arcs = topo.arcs.map(function (arc) {
      var x = 0, y = 0;
      return arc.map(function (p) {
        if (!tf) return [p[0], p[1]];
        x += p[0]; y += p[1];
        return [x * tf.scale[0] + tf.translate[0], y * tf.scale[1] + tf.translate[1]];
      });
    });
    var rings = [];
    topo.objects.land.geometries.forEach(function (g) {
      var polys = g.type === 'Polygon' ? [g.arcs] : g.type === 'MultiPolygon' ? g.arcs : [];
      polys.forEach(function (poly) {
        poly.forEach(function (ring) {
          var pts = [];
          ring.forEach(function (i) {
            var a = i < 0 ? arcs[~i].slice().reverse() : arcs[i];
            pts = pts.concat(pts.length ? a.slice(1) : a);
          });
          rings.push(pts.map(function (p) { return vec(p[0], p[1]); }));
        });
      });
    });
    return rings;
  }

  make.globe = function (info) {
    var host = layer('bg-globe');
    add(host, 'stars');
    var cv = canvas(host);
    add(host, 'scrim');

    var land = [], grat = [], arcs = [], ports = [], pings = [];
    // Start facing the viewer's side of the world, roughly, from their UTC offset.
    var lon0 = -new Date().getTimezoneOffset() / 4, lat0 = 22, spin = 0, lastDx = 0;
    var zoom = 1, zoomFrom = null, zoomT = 0, t = 0, R = 1, cx = 0, cy = 0;

    var lo, la, line;
    for (lo = -180; lo < 180; lo += 30) {
      line = [];
      for (la = -90; la <= 90; la += 3) line.push(vec(lo, la));
      grat.push(line);
    }
    for (la = -60; la <= 60; la += 30) {
      line = [];
      for (lo = -180; lo <= 180; lo += 3) line.push(vec(lo, la));
      grat.push(line);
    }

    fetch(LAND).then(function (r) { return r.json(); })
      .then(function (topo) { land = decodeLand(topo); })
      .catch(function () {});   // no outlines: the graticule and route still draw

    var codes = routeCodes(info.route);
    if (codes.length > 1) {
      window.Airports.load().then(function (db) {
        codes.forEach(function (c) {
          if (db[c]) ports.push({ code: c, lon: db[c][1], lat: db[c][0], v: vec(db[c][1], db[c][0]) });
        });
        // Each leg arcs up off the surface, higher for a longer hop.
        for (var i = 1; i < ports.length; i++) {
          var a = ports[i - 1].v, b = ports[i].v;
          var om = Math.acos(Math.max(-1, Math.min(1, a[0] * b[0] + a[1] * b[1] + a[2] * b[2])));
          var arc = [];
          for (var j = 0; j <= 48; j++) {
            var f = j / 48, s = om < 1e-6 ? 0 : 1 / Math.sin(om);
            var A = om < 1e-6 ? 1 - f : Math.sin((1 - f) * om) * s, B = om < 1e-6 ? f : Math.sin(f * om) * s;
            var lift = 1 + Math.min(0.12, om * 0.25) * Math.sin(Math.PI * f);
            arc.push([(A * a[0] + B * b[0]) * lift, (A * a[1] + B * b[1]) * lift, (A * a[2] + B * b[2]) * lift]);
          }
          arcs.push(arc);
        }
        if (ports.length) {
          var mid = ports.reduce(function (s, p) { return s + p.lon; }, 0) / ports.length;
          if (!zoomFrom) lon0 = mid;
        }
      }).catch(function () {});
    }

    // Orthographic projection: [screen x, screen y, depth]. Depth >= 0 faces us.
    var cl, sl, cp, sp;
    function P(v) {
      var a = v[0] * cl + v[1] * sl, b = v[1] * cl - v[0] * sl;
      return [cx + R * b, cy - R * (cp * v[2] - sp * a), sp * v[2] + cp * a];
    }
    function seen(q, lifted) {
      return q[2] >= 0 || (lifted && (q[0] - cx) * (q[0] - cx) + (q[1] - cy) * (q[1] - cy) > R * R);
    }

    // Polylines in two passes: the far side faint, the near side bright.
    function lines(ctx, list, back, front, width, lifted) {
      ctx.lineWidth = width;
      [[back, false], [front, true]].forEach(function (pass) {
        if (!pass[0]) return;
        ctx.strokeStyle = pass[0];
        ctx.beginPath();
        list.forEach(function (l) {
          var pen = false;
          for (var i = 0; i < l.length; i++) {
            var q = P(l[i]);
            if (seen(q, lifted) === pass[1]) {
              if (pen) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]);
              pen = true;
            } else {
              pen = false;
            }
          }
        });
        ctx.stroke();
      });
    }

    return {
      frame: function (S) {
        var ctx = cv.ctx, w = cv.w, h = cv.h, k = cv.k;
        t += S.dt;
        if (zoomFrom) {
          // zero: swing round to the start of the trip and dive in
          zoomT = Math.min(1, zoomT + S.dt / 2.6);
          var e = ease(zoomT), d = ((zoomFrom.to - zoomFrom.lon + 540) % 360) - 180;
          lon0 = zoomFrom.lon + d * e;
          lat0 = zoomFrom.lat + (zoomFrom.toLat - zoomFrom.lat) * e;
          zoom = 1 + 3.5 * e * e;
        } else if (!S.reduce) {
          lon0 -= (S.live ? 3 + (S.speed / 900) * 70 : 2) * S.dt;
        }
        lon0 -= spin * S.dt;
        lon0 = ((lon0 + 180) % 360 + 360) % 360 - 180;
        spin *= Math.exp(-S.dt * 1.5);

        R = Math.min(w, h) * 0.36 * zoom;
        cx = w / 2 - S.px * w * 0.015;
        cy = h / 2 - S.py * h * 0.015;
        var tilt = Math.max(-80, Math.min(80, lat0 + S.py * 6));
        cl = Math.cos(lon0 * RAD); sl = Math.sin(lon0 * RAD);
        cp = Math.cos(tilt * RAD); sp = Math.sin(tilt * RAD);

        ctx.clearRect(0, 0, w, h);
        // atmosphere, then the ocean disc
        var g = ctx.createRadialGradient(cx, cy, R * 0.95, cx, cy, R * 1.2);
        g.addColorStop(0, hsla(S.hue, 100, 62, 0.32 + 0.35 * S.beat));
        g.addColorStop(1, hsla(S.hue, 100, 62, 0));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(cx, cy, R * 1.2, 0, Math.PI * 2); ctx.fill();
        g = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.35, R * 0.1, cx, cy, R);
        g.addColorStop(0, hsla(S.hue, 70, 16, 0.95));
        g.addColorStop(1, 'rgba(5,5,18,0.97)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();

        ctx.lineJoin = 'round';
        lines(ctx, grat, hsla(S.hue, 100, 70, 0.04), hsla(S.hue, 100, 70, 0.13), 1 * k);
        lines(ctx, land, hsla(S.hue, 100, 70, 0.07), hsla(S.hue, 100, 72, 0.85), 1.3 * k);
        lines(ctx, arcs, null, hsla(320, 100, 70, 0.9), 2.2 * k, true);

        // a comet running the whole trip, over and over
        var pts = [].concat.apply([], arcs);
        if (pts.length) {
          var q = P(pts[Math.floor((t * 0.18 % 1) * pts.length)]);
          if (seen(q, true)) {
            ctx.fillStyle = '#fff';
            ctx.shadowColor = hsla(320, 100, 70, 1);
            ctx.shadowBlur = 14 * k;
            ctx.beginPath(); ctx.arc(q[0], q[1], 3 * k, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
          }
        }

        ctx.font = '700 ' + (11 * k) + 'px ui-monospace, Consolas, monospace';
        ctx.textAlign = 'left';
        ports.forEach(function (p) {
          var q = P(p.v);
          if (q[2] < 0) return;
          ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.arc(q[0], q[1], 3 * k, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = hsla(S.hue, 100, 70, 0.3 + 0.6 * S.beat);
          ctx.lineWidth = 1.5 * k;
          ctx.beginPath(); ctx.arc(q[0], q[1], (6 + 6 * S.beat) * k, 0, Math.PI * 2); ctx.stroke();
          ctx.fillStyle = 'rgba(255,255,255,0.85)';
          ctx.fillText(p.code, q[0] + 9 * k, q[1] - 7 * k);
        });

        for (var i = pings.length - 1; i >= 0; i--) {
          var p = pings[i];
          p.t += S.dt * 0.8;
          if (p.t >= 1) { pings.splice(i, 1); continue; }
          var pq = P(p.v);
          if (pq[2] < 0) continue;
          ctx.strokeStyle = hsla(S.hue, 100, 75, 1 - p.t);
          ctx.lineWidth = 2 * k;
          ctx.beginPath(); ctx.arc(pq[0], pq[1], (4 + p.t * 60) * k, 0, Math.PI * 2); ctx.stroke();
        }
      },

      // On the globe: a ping where you tapped. Off it: a flick of spin.
      poke: function (x, y) {
        var X = (x * cv.k - cx) / R, Y = (cy - y * cv.k) / R, r2 = X * X + Y * Y;
        if (r2 > 1) { spin += (x * cv.k < cx ? -1 : 1) * 60; return; }
        var dep = Math.sqrt(1 - r2);
        var z = cp * Y + sp * dep, a = cp * dep - sp * Y;
        pings.push({ v: [a * cl - X * sl, a * sl + X * cl, z], t: 0 });
      },

      // Drag to turn it; let go and it coasts.
      drag: function (dx, dy, end) {
        if (zoomFrom) return;
        if (end) { spin = Math.max(-150, Math.min(150, lastDx * cv.k / R / RAD * 30)); return; }
        spin = 0;
        lastDx = dx;
        lon0 -= dx * cv.k / R / RAD;
        lat0 = Math.max(-70, Math.min(70, lat0 + dy * cv.k / R / RAD));
      },

      zero: function () {
        var o = ports[0];
        zoomFrom = { lon: lon0, lat: lat0, to: o ? o.lon : lon0, toLat: o ? o.lat : lat0 };
        spin = 0;
      },

      resize: function () { cv.fit(); },
      stop: function () { host.remove(); }
    };
  };

  // ---------- departure board: split-flap rows, your flight on top ----------

  var FLAP = ' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:.-';
  var AIRLINES = ['AA', 'UA', 'DL', 'AS', 'WN', 'B6', 'BA', 'LH', 'AF', 'KL', 'NH', 'JL', 'QF', 'AC',
                  'EK', 'SQ', 'CX', 'KE', 'HA', 'VS'];
  var CITIES = ['ANCHORAGE', 'ATLANTA', 'AUSTIN', 'BOSTON', 'CHICAGO', 'DALLAS', 'DENVER', 'DUBLIN',
                'FRANKFURT', 'HONOLULU', 'HONG KONG', 'LAS VEGAS', 'LONDON', 'LOS ANGELES', 'MEXICO CITY',
                'MIAMI', 'MINNEAPOLIS', 'NEW YORK JFK', 'ORLANDO', 'PARIS', 'PHOENIX', 'REYKJAVIK',
                'SAN DIEGO', 'SAN FRANCISCO', 'SEATTLE', 'SEOUL', 'SINGAPORE', 'SYDNEY', 'TOKYO',
                'TORONTO', 'VANCOUVER'];
  var REMARK_CLASS = {
    'ON TIME': 'r-ok', 'LANDED': 'r-ok', 'ARRIVED': 'r-ok', 'DELAYED': 'r-warn', 'LAYOVER': 'r-warn',
    'CANCELLED': 'r-bad', 'EMERGENCY': 'r-bad', 'BOARDING': 'r-hot', 'FINAL CALL': 'r-hot',
    'DEPARTED': 'r-hot', 'IN FLIGHT': 'r-hot', 'TAXIING': 'r-hot', 'SIGNAL LOST': 'r-warn'
  };

  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

  make.board = function (info) {
    var host = layer('bg-board');
    var board = add(host, 'board');
    add(host, 'scrim');

    var hhmm;
    try {
      hhmm = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit',
                                                hour12: false, timeZone: info.zone || undefined });
    } catch (e) {
      hhmm = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    }
    function clock(ms) { return hhmm.format(new Date(ms)).slice(0, 8); }

    var codes = routeCodes(info.route), cityOf = {};
    window.Airports.load().then(function (db) {
      codes.forEach(function (c) { if (db[c]) cityOf[c] = db[c][2].toUpperCase(); });
    }).catch(function () {});

    var fields, rows = [], fillers = [], flipping = [], head = null;
    var acc = 0, wait = 4, lastSec = '', tiltX = 99, tiltY = 99;
    var hlCount = info.flights ? info.flights.length : 1;

    // One field of `n` tiles; returns its cells to be set later.
    function field(row, n, cls) {
      var f = document.createElement('span');
      f.className = 'bfld' + (cls ? ' ' + cls : '');
      var cells = [];
      for (var i = 0; i < n; i++) {
        var c = document.createElement('span');
        c.className = 'ch';
        c.textContent = ' ';
        f.appendChild(c);
        cells.push({ el: c, ch: ' ' });
      }
      row.appendChild(f);
      return { el: f, cells: cells, n: n };
    }

    function write(fld, text, flip, slow) {
      text = String(text).toUpperCase();
      text = (text + new Array(fld.n + 1).join(' ')).slice(0, fld.n);
      for (var i = 0; i < fld.n; i++) {
        var c = fld.cells[i], ch = text.charAt(i);
        if (c.ch === ch && !slow) continue;
        c.ch = ch;
        if (!flip) { c.el.textContent = ch; continue; }
        if (c.steps === undefined || c.steps <= 0) flipping.push(c);
        c.steps = (slow ? 8 : 3) + Math.floor(Math.random() * (slow ? 14 : 8));
      }
    }

    function filler(at) {
      var r = Math.random();
      return {
        time: at,
        flight: pick(AIRLINES) + ' ' + (10 + Math.floor(Math.random() * 2980)),
        dest: pick(CITIES),
        gate: String.fromCharCode(65 + Math.floor(Math.random() * 5)) + (1 + Math.floor(Math.random() * 38)),
        remark: r < 0.06 ? 'CANCELLED' : r < 0.22 ? 'DELAYED' : 'ON TIME'
      };
    }

    function refill() {
      fillers = [];
      var at = Date.now() + 4 * 60e3;
      for (var i = 0; i < 24; i++) { at += (3 + Math.random() * 9) * 60e3; fillers.push(filler(at)); }
    }

    // Your flight(s): the countdown's deadline, then what the tracker reports.
    function highlighted(S) {
      var st = S.ms > 0 ? null : window.FlightTracker.statuses();
      var names = info.flights || [''];
      return names.map(function (name, i) {
        var remark;
        if (S.ms > 3600e3 || (i > 0 && S.ms > 0)) remark = 'ON TIME';
        else if (S.ms > 600e3) remark = 'BOARDING';
        else if (S.ms > 0) remark = 'FINAL CALL';
        else if (st && st[i]) {
          remark = { 'In flight': 'IN FLIGHT', 'Landed': 'LANDED', 'Layover': 'LAYOVER', 'Taxiing': 'TAXIING',
                     'On the ground': i === 0 ? 'DEPARTED' : 'ON TIME', 'Signal lost': 'IN FLIGHT',
                     'Waiting for signal': i === 0 ? 'DEPARTED' : 'ON TIME' }[st[i]] ||
                   (st[i].indexOf('Emergency') === 0 ? 'EMERGENCY' : 'DEPARTED');
        } else remark = 'DEPARTED';
        var to = codes[i + 1];
        return {
          time: i === 0 && isFinite(info.target) ? clock(info.target).slice(0, 5) : '',
          flight: name || 'T-0',
          dest: to ? cityOf[to] || to : name ? '' : info.label || 'FINAL COUNTDOWN',
          gate: '',
          remark: remark
        };
      });
    }

    function layout() {
      var narrow = innerWidth < 700;
      fields = narrow
        ? [['time', 5, 'TIME'], ['flight', 7, 'FLIGHT'], ['dest', 11, 'TO'], ['remark', 10, 'REMARKS']]
        : [['time', 5, 'TIME'], ['flight', 7, 'FLIGHT'], ['dest', 15, 'DESTINATION'], ['gate', 4, 'GATE'],
           ['remark', 11, 'REMARKS']];
      var em = fields.reduce(function (s, f) { return s + f[1] * 0.9; }, 0) + 0.6 * (fields.length - 1);
      var px = Math.min(30, innerWidth * 0.94 / em);
      var n = Math.max(4, Math.min(20, Math.floor((innerHeight * 0.9 / px - 3.6) / 1.5)));
      board.style.fontSize = px.toFixed(2) + 'px';
      board.innerHTML = '';
      flipping = [];
      rows = [];

      var hd = document.createElement('div');
      hd.className = 'bhead';
      hd.innerHTML = '<span class="btitle">DEPARTURES</span>';
      var clk = document.createElement('span');
      clk.className = 'brow';
      hd.appendChild(clk);
      head = field(clk, 8);
      board.appendChild(hd);

      var cols = document.createElement('div');
      cols.className = 'bcols';
      fields.forEach(function (f) {
        var s = document.createElement('span');
        s.style.width = ((f[1] * 0.9 - 0.08) / 0.62).toFixed(2) + 'em';
        s.textContent = f[2];
        cols.appendChild(s);
      });
      board.appendChild(cols);

      for (var i = 0; i < n; i++) {
        var row = document.createElement('div');
        row.className = 'brow' + (i < hlCount ? ' hl' : '');
        var r = { el: row, f: {} };
        if (i < hlCount) r.glow = add(row, 'bglow');
        fields.forEach(function (f) { r.f[f[0]] = field(row, f[1]); });
        board.appendChild(row);
        rows.push(r);
      }
    }

    function fill(S, flip, slow) {
      var data = highlighted(S).concat(fillers.map(function (x) {
        return { time: clock(x.time).slice(0, 5), flight: x.flight, dest: x.dest, gate: x.gate, remark: x.remark };
      }));
      rows.forEach(function (r, i) {
        var d = data[i] || {};

  var c = null, ctx, k = 1, parts = [], pending = 0, running = false, last = 0;
  var HUES = [186, 320, 45, 280, 150];

  function size() {
    k = Math.min(2, window.devicePixelRatio || 1);
    c.width = Math.round(innerWidth * k);
    c.height = Math.round(innerHeight * k);
  }

  function ensure() {
    if (c) return;

    c.className = 'fx';
    c.setAttribute('aria-hidden', 'true');
    document.body.appendChild(c);

  function rocket() {
    pending--;

    parts.push({ kind: 'rocket', x: c.width * (0.15 + Math.random() * 0.7), y: c.height,
                 vx: (Math.random() - 0.5) * 80 * k, vy: -Math.sqrt(2 * g * (c.height - top)),
                 hue: HUES[Math.floor(Math.random() * HUES.length)] });
    go();
  }

  function burst(x, y, hue) {
    for (var i = 0; i < 80; i++) {
      var a = Math.random() * Math.PI * 2, sp = (60 + Math.random() * 300) * k;
      parts.push({ kind: 'spark', x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,

    }
  }

  function confetti(n) {
    for (var i = 0; i < n; i++) {

                   vy: (90 + Math.random() * 160) * k, sway: Math.random() * 6, spin: 2 + Math.random() * 8,
                   rot: Math.random() * 6, hue: HUES[Math.floor(Math.random() * HUES.length)],
                   w: (5 + Math.random() * 4) * k, h: (8 + Math.random() * 6) * k, age: 0 });

    if (running) return;

        if (p.vy >= -40 * k) { burst(p.x, p.y, p.hue); parts.splice(i, 1); continue; }

        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.05, p.y - p.vy * 0.05); ctx.stroke();

    celebrate: function (kind) {

<!-- Deadline config, for serving site/ without Docker. In the container the entrypoint
     inlines the settings below instead, so no separately cacheable file can go stale. -->
<script src="config.js"></script>
<!--COUNTDOWN_CONFIG-->
<script>
(function () {
  // There is no built-in deadline. It comes from COUNTDOWN_TARGET in .env (via the
  // generated config.js) or from ?t= on the URL; with neither, the page says so
  // rather than counting down to a date nobody asked for.
  var cfg = window.COUNTDOWN || {};
  var qs = new URLSearchParams(location.search);

  // A ?t= on the URL stands alone: it does not inherit the zone or caption from .env.
  var urlTarget = qs.get('t');
  var wanted = urlTarget || cfg.target || '';
  var zone = qs.get('tz') || (urlTarget ? '' : cfg.tz || '');
  var label = qs.get('label') || (urlTarget ? '' : cfg.label || '');
  // The flight is not tied to the deadline, so it carries over even with ?t=.
  var flight = qs.get('flight') || cfg.flight || '';
  // A ?flight= stands alone like ?t= does: it does not inherit COUNTDOWN_ROUTE.
  var flightRoute = qs.get('route') || (qs.get('flight') ? '' : cfg.route || '');

  var clockEl = document.getElementById('clock');
  var targetEl = document.getElementById('target');

  // Replaces the digits with an explanation and stops. Nothing is cached or
  // guessed here, so whatever the viewer sees is the actual configured state.
  function unconfigured(html) {
    clockEl.classList.add('unset');
    targetEl.className = 'target error';
    targetEl.innerHTML = html;
    document.title = 'No deadline set';
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function offsetAt(utcMs, tz) {
    var parts = new Intl.DateTimeFormat('en-US', {
      timeZone: tz, hour12: false,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit'

    var p = {};

    return Date.UTC(+p.year, +p.month - 1, +p.day,
